<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Практика · Глава 3 — Python‑тренажер</title>
<style>
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --accent:#0071e3;
  --accent-dark:#005bb9;
  --danger:#c22a1e;
  --ok:#1c7c3c;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 8px 24px rgba(0,0,0,.06);
  --shadow-lift:0 14px 34px rgba(0,0,0,.10);
  --border:rgba(0,0,0,.07);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:clip;
}
.container{width:100%;max-width:960px;margin:0 auto;padding-left:20px;padding-right:20px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:#fff;color:var(--accent);padding:12px 18px;border-radius:0 0 12px 0;font-weight:600;text-decoration:none}
.skip:focus{left:0}
b{font-weight:700}
.fatal{padding:40px 20px;font-family:var(--mono);font-size:14px;color:var(--danger);white-space:pre-wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:none;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s ease,transform .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-small{min-height:44px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text)}
.btn-small:hover{background:#f5f5f7}

.start-card{max-width:560px;margin:44px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.eyebrow{color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.start-card h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.author{color:var(--muted);margin:0 0 18px;font-size:15px}
.start-list{margin:0 0 22px;padding-left:20px;color:var(--muted);font-size:14.5px;display:grid;gap:6px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600}
.field input{min-height:48px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;color:var(--text);width:100%}
.field input:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.field input.bad{border-color:var(--danger);box-shadow:0 0 0 3px rgba(194,42,30,.12)}
.err{color:var(--danger);font-size:13px;margin:0}

.lesson-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0 10px}
.lesson-head h1{font-size:20px;margin:0;letter-spacing:-.01em;flex:1 1 auto;min-width:160px}
.chip-student{min-height:44px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:0 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.chip-student:hover{background:#f5f5f7}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:#f5f5f7}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.section-note{color:var(--muted);font-size:14.5px;margin:14px 0 18px;max-width:760px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:0 0 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:17px}
.card p{margin:0 0 10px;font-size:14.5px;line-height:1.6}
.call{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;margin:0 0 14px;border:1px solid}
.call p{margin:0;font-size:14.5px;line-height:1.6;min-width:0}
.call>div{min-width:0}
.call-ic{font-size:20px;line-height:1.4;flex:none}
.call.info{background:rgba(0,113,227,.07);border-color:rgba(0,113,227,.25)}
.call.warn{background:rgba(255,159,10,.1);border-color:rgba(255,159,10,.35)}
.call.ok{background:rgba(52,199,89,.1);border-color:rgba(52,199,89,.35)}
.code-window{background:#161617;border-radius:14px;overflow:hidden;margin:0 0 12px;box-shadow:var(--shadow);min-width:0}
.code-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#1d1d1f}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.code-bar .file{margin-left:6px;color:#98989d;font-family:var(--mono);font-size:12px}
pre.code{margin:0;padding:14px 16px;color:#f5f5f7;font-family:var(--mono);font-size:13px;line-height:1.65;overflow-x:auto;white-space:pre;max-width:100%}
.tk-c{color:#83838a}.tk-k{color:#ff7ab2}.tk-s{color:#ffa740}.tk-n{color:#d9bf69}.tk-f{color:#6bdfff}
.screen{background:rgba(52,199,89,.08);border:1px solid rgba(52,199,89,.35);border-radius:12px;padding:10px 14px;margin:0 0 12px;min-width:0}
.screen-label{display:block;font-size:11.5px;font-weight:700;color:var(--ok);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.screen pre{margin:0;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;color:var(--text)}
.tbl-wrap{overflow-x:auto;margin:0 0 14px;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:#f5f5f7;font-weight:700}
tr:last-child td{border-bottom:none}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.search{min-height:44px;border:1px solid var(--border);border-radius:999px;padding:0 18px;font-size:14.5px;background:#fff;color:var(--text);flex:1 1 200px;min-width:0}
.search:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.fchip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.fchip[aria-pressed="true"]{background:rgba(0,113,227,.1);border-color:var(--accent);color:var(--accent-dark)}
.progline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:10px 0 6px}
.progline b{color:var(--text)}
.sum-bar{height:8px;background:#e8e8ed;border-radius:999px;overflow:hidden;margin:0 0 16px}
.sum-bar i{display:block;height:100%;background:linear-gradient(90deg,#37a0ff,var(--accent));border-radius:999px;transition:width .3s ease}

.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 12px;min-width:0;overflow:hidden}
.task-head-btn{display:flex;width:100%;background:none;border:none;cursor:pointer;gap:10px;align-items:center;padding:16px 18px;text-align:left;min-height:56px}
.task-head-btn:hover{background:rgba(0,0,0,.03)}
.task-num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);background:rgba(0,113,227,.1);border-radius:8px;padding:4px 9px;flex:none}
.task-title{font-size:15.5px;font-weight:600;flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.task-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;color:#48484a;background:#e8e8ed;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.easy{background:rgba(52,199,89,.16);color:#1c7c3c}
.tag.mid{background:rgba(255,159,10,.16);color:#8a5a00}
.tag.hard{background:rgba(255,69,58,.14);color:#b3261e}
.tag.solved{background:rgba(52,199,89,.16);color:#1c7c3c;font-weight:700}
.chev{color:var(--muted);font-size:14px;flex:none}
.task-body{padding:4px 18px 18px;border-top:1px solid var(--border)}
.task-text{margin:0 0 10px;font-size:14.5px;line-height:1.65}
.formula{background:#f5f5f7;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-family:var(--mono);font-size:13.5px;text-align:center;overflow-x:auto;white-space:pre-wrap}
.task-list{margin:0 0 12px;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
.task-steps{margin:0 0 12px;padding-left:22px;display:grid;gap:4px;font-size:14px;line-height:1.55}
.task-steps li::marker{color:var(--accent);font-weight:700}
.label-sm{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
textarea.code-input{width:100%;min-height:150px;resize:vertical;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.6;background:#fff;color:var(--text)}
textarea.code-input:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn-small.on{background:rgba(52,199,89,.14);border-color:rgba(52,199,89,.5);color:#1c7c3c}
.btn-small.warnbtn{color:#8a5a00;border-color:rgba(255,159,10,.5)}
.hint{display:flex;gap:12px;background:rgba(255,159,10,.09);border:1px solid rgba(255,159,10,.35);border-radius:14px;padding:12px 14px;margin:10px 0 4px}
.hint>div{min-width:0;flex:1}
.hint-ic{font-size:20px;flex:none;line-height:1.4}
.hint p{margin:0;font-size:14px;line-height:1.6}
.hint .code-window{margin:10px 0 0}
.hint .code-bar{padding:8px 12px}
.hint pre.code{padding:12px 14px;font-size:12.5px}
.etalon{margin:10px 0 4px}
.etalon .code-window{margin:0}
.confirm{background:rgba(194,42,30,.07);border:1px solid rgba(194,42,30,.35);border-radius:14px;padding:12px 14px;margin:10px 0 4px;font-size:14px}
.confirm p{margin:0 0 10px}
.empty-list{color:var(--muted);font-size:14.5px;padding:18px;border:1px dashed var(--border);border-radius:var(--radius);text-align:center}

.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px;display:grid;gap:18px}
.sum-row{display:flex;gap:14px;align-items:flex-start}
.sum-ic{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(0,113,227,.1);display:grid;place-items:center;font-size:20px}
.sum-body{flex:1;min-width:0}
.sum-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px;margin-bottom:6px}
.sum-top b{font-size:15px}
.sum-note{color:var(--muted);font-size:13px;margin:6px 0 0}
.sum-actions{display:flex;justify-content:center;margin:22px 0 6px}

.report{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;max-width:820px;margin:16px auto 0;min-width:0}
.report h2{margin:0 0 4px;font-size:24px}
.report .meta{display:grid;gap:4px;font-size:14.5px;margin:12px 0 6px}
.report h3{font-size:16px;margin:18px 0 6px}
.report pre{background:#f5f5f7;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
.report .rep-note{color:var(--muted);font-size:13px;margin:6px 0}
.report-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 4px}
.hint-print{color:var(--muted);font-size:13.5px;text-align:center;margin:0 0 40px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:100;box-shadow:var(--shadow-lift);max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .container{padding:0;max-width:100%}
  .report{border:none;box-shadow:none;margin:0;padding:0;max-width:100%}
  .report pre{white-space:pre-wrap;word-break:break-word}
}
@media (max-width:640px){
  .card{padding:16px}
  .task-head-btn{padding:14px}
  .task-body{padding:4px 14px 14px}
  pre.code{font-size:12px;padding:12px}
  .sum-card{padding:16px}
  .task-tags{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
</style>
</head>
<body>
<a class="skip no-print" href="#main">Перейти к содержимому</a>
<div id="app"></div>
<script>
/* аварийный экран: если основной скрипт упадёт, покажем текст ошибки вместо пустоты */
window.addEventListener("error", function(ev){
  var a = document.getElementById("app");
  if(a && !a.innerHTML.trim()){
    a.innerHTML = '<div class="fatal">Ошибка скрипта: ' + (ev.message || "неизвестная") + '</div>';
  }
});
</script>
<script>
"use strict";
/* ================= CONSTANTS ================= */
var META = { num:3, topic:"Повторения", author:"Масликов М.М." };
var DONE_SHARE = 0.6;

/* Краткая справка по главе 3 */
var REF_CARDS = [
  { t:"Цикл while",
    p:"Цикл while выполняет тело, пока условное выражение возвращает True: проверка условия происходит перед каждой итерацией. Если условие ложно изначально, тело не выполнится ни разу; если никогда не станет ложным — программа зациклится.",
    code:'x = int(input("Введите целое число (0 для выхода):"))\nwhile x != 0:\n    if x > 0:\n        print("Это положительное число.")\n    else:\n        print("Это отрицательное число.")\n    x = int(input("Введите целое число (0 для выхода):"))' },
  { t:"Цикл for и функция range",
    p:"Тело цикла for выполняется по разу для каждого элемента коллекции. Коллекцию целых чисел создаёт range: range(k) — от 0 до k−1; range(n, k) — от n до k−1; range(n, k, s) — с шагом s, включая нисходящие диапазоны при отрицательном шаге.",
    code:'limit = int(input("Введите целое число:"))\nprint("Все числа, кратные трем, вплоть до", limit, ":")\nfor i in range(3, limit + 1, 3):\n    print(i)' },
  { t:"Вложенные циклы",
    p:"В тело цикла может быть вложен любой другой цикл: внутренний прокручивается полностью на каждой итерации внешнего. Классическая связка — while читает данные, for повторяет действие заданное число раз.",
    code:'message = input("Введите сообщение (оставьте его пустым для выхода):")\nwhile message != "":\n    n = int(input("Сколько раз повторить сообщение?"))\n    for i in range(n):\n        print(message)\n    message = input("Введите сообщение (оставьте его пустым для выхода):")' },
  { t:"Циклы и накопление результата",
    p:"Типовые приёмы главы: сумма (s = s + x), счётчик (k = k + 1), сборка строки (result = result + ch). Цикл for может проходить и по символам строки, и по элементам списка.",
    code:'total = 0\nfor value in data:\n    total = total + value\nprint("Сумма значений элементов списка:", total)' },
  { t:"Ввод до sentinel-значения",
    p:"Многие задачи главы читают данные до сигнала окончания: ноль (задача 63) или пустая строка (66, 67, 69, 70). Sentinel-значение не участвует в расчётах: его проверяют до добавления к сумме или счётчику.",
    code:'line = input("Введите цену товара (пустая строка для выхода):")\nwhile line != "":\n    total = total + float(line)\n    line = input("Введите цену товара (пустая строка для выхода):")' }
];

/* Задачи главы 3 (упражнения 63–84): условия дословно из сборника,
   включая формулы, алгоритмы, примеры, подсказки и примечания книги */
var TASKS = [
  { id:63, title:"Среднее значение", diff:"mid",
    text:"В данном упражнении вы должны написать программу для подсчета среднего значения всех введенных пользователем чисел. Индикатором окончания ввода будет служить ноль. При этом программа должна выдавать соответствующее сообщение об ошибке, если первым же введенным пользователем значением будет ноль.",
    bookHint:"Поскольку ноль является индикатором окончания ввода, его не нужно учитывать при расчете среднего.",
    hint:"Копите сумму и количество введенных чисел в цикле while до нуля; среднее = сумма / количество. Отдельно обработайте случай, когда ноль введен первым.",
    solution:'# Среднее значение введенных чисел\ncount = 0\ntotal = 0\nx = float(input("Введите число (0 для окончания ввода): "))\nif x == 0:\n    print("Ошибка: первым значением не может быть ноль.")\nelse:\n    while x != 0:\n        total = total + x\n        count = count + 1\n        x = float(input("Введите число (0 для окончания ввода): "))\n    print("Среднее значение введенных чисел:", total / count)' },
  { id:64, title:"Таблица со скидками", diff:"mid",
    text:"В магазине была объявлена скидка размером 60 % на ряд товаров, и для того чтобы покупатели лучше ориентировались, владелец торговой точки решил вывесить отдельную таблицу со скидками с указанием уцененных товаров и их оригинальных цен. Используйте цикл для создания подобной таблицы, в которой будут исходные цены, суммы скидок и новые цены для покупок на сумму $4,95, $9,95, $14,95, $19,95 и $24,95. Убедитесь в том, что суммы скидки и новые цены отображаются с двумя знаками после запятой.",
    hint:"Пройдитесь циклом for по списку цен [4.95, 9.95, 14.95, 19.95, 24.95]; скидка = цена × 0.60, новая цена = цена − скидка; вывод через %.2f.",
    solution:'# Таблица со скидками 60 %\nDISCOUNT_RATE = 0.60\nprint("Цена    Скидка  Новая цена")\nfor price in [4.95, 9.95, 14.95, 19.95, 24.95]:\n    discount = price * DISCOUNT_RATE\n    new_price = price - discount\n    print("%6.2f  %6.2f  %10.2f" % (price, discount, new_price))' },
  { id:65, title:"Таблица соотношения температур", diff:"mid",
    text:"Напишите программу для вывода таблицы соотношения температур, выраженных в градусах Цельсия и Фаренгейта. В таблице должны размещаться все температуры между 0 и 100 градусами Цельсия, кратные 10. Дополните таблицу подходящими заголовками. Формулу для перевода температуры из градусов Цельсия в градусы Фаренгейта можно легко найти на просторах интернета.",
    hint:"Цикл for c in range(0, 101, 10); перевод: F = C × 9/5 + 32; не забудьте строку заголовков таблицы.",
    solution:'# Таблица соотношения температур\nprint("Цельсий   Фаренгейт")\nfor c in range(0, 101, 10):\n    f = c * 9 / 5 + 32\n    print("%7d   %10.1f" % (c, f))' },
  { id:66, title:"Никаких центов", diff:"hard",
    text:"4 февраля 2013 года Королевским канадским монетным двором была выпущена последняя монета номиналом в один цент. После вывода центов из обращения все магазины вынуждены были изменить цены на товары таким образом, чтобы они стали кратны пяти центам (расчеты по банковским картам по-прежнему ведутся с учетом центов). И хотя продавцы вольны сами определять политику преобразования цен, большинство из них просто округлили цены до ближайших пяти центов.\n\nНапишите программу, запрашивающую у пользователя цены, пока не будет введена пустая строка. На первой строке выведите сумму всех введенных пользователем сумм, а на второй – сумму, которую покупатель должен заплатить наличными. Эта сумма должна быть округлена до ближайших пяти центов. Вычислить сумму для оплаты наличными можно, получив остаток от деления общей суммы в центах на 5. Если он будет меньше 2,5, следует округлить сумму вниз, а если больше – вверх.",
    hint:"Сумму собирайте в цикле до пустой строки; остаток total * 100 % 5 показывает, сколько центов «лишние»: меньше 2.5 — округляем вниз, иначе вверх до ближайших пяти.",
    solution:'# Полная сумма покупки и сумма для оплаты наличными\nPENNIES_PER_NICKEL = 5\nNICKEL = 0.05\ntotal = 0.00\nline = input("Введите цену товара (пустая строка для выхода):")\nwhile line != "":\n    total = total + float(line)\n    line = input("Введите цену товара (пустая строка для выхода):")\nprint("Полная сумма к оплате: %.02f" % total)\nrounding_indicator = total * 100 % PENNIES_PER_NICKEL\nif rounding_indicator < PENNIES_PER_NICKEL / 2:\n    cash_total = total - rounding_indicator / 100\nelse:\n    cash_total = total + NICKEL - rounding_indicator / 100\nprint("Сумма для оплаты наличными: %.02f" % cash_total)' },
  { id:67, title:"Найти периметр многоугольника", diff:"hard",
    text:"Напишите программу для расчета периметра заданного многоугольника. Начните с запроса у пользователя координат x и y первой точки многоугольника. Продолжайте запрашивать координаты следующих точек фигуры, пока пользователь не оставит строку ввода координаты по оси x пустой. После ввода каждой пары значений вы должны вычислить длину очередной стороны многоугольника и прибавить полученное значение к будущему ответу. По окончании ввода необходимо вычислить расстояние от последней введенной точки до первой, чтобы замкнуть фигуру, и вывести итоговый результат.",
    example:"Введите первую координату X: 0\nВведите первую координату Y: 0\nВведите следующую координату X (Enter для окончания ввода): 1\nВведите следующую координату Y: 0\nВведите следующую координату X (Enter для окончания ввода): 0\nВведите следующую координату Y: 1\nВведите следующую координату X (Enter для окончания ввода):\nПериметр многоугольника равен 3.414213562373095",
    hint:"Расстояние между двумя точками — по теореме Пифагора: sqrt((x1 − x2)² + (y1 − y2)²). Храните координаты предыдущей точки и не забудьте замкнуть последнюю на первую.",
    solution:'# Периметр многоугольника по координатам точек\nfrom math import sqrt\nperimeter = 0\nfirst_x = float(input("Введите первую координату X:"))\nfirst_y = float(input("Введите первую координату Y:"))\nprev_x = first_x\nprev_y = first_y\nline = input("Введите следующую координату X (Enter для окончания ввода):")\nwhile line != "":\n    x = float(line)\n    y = float(input("Введите следующую координату Y:"))\n    dist = sqrt((prev_x - x) ** 2 + (prev_y - y) ** 2)\n    perimeter = perimeter + dist\n    prev_x = x\n    prev_y = y\n    line = input("Введите следующую координату X (Enter для окончания ввода):")\ndist = sqrt((first_x - x) ** 2 + (first_y - y) ** 2)\nperimeter = perimeter + dist\nprint("Периметр многоугольника равен", perimeter)' },
  { id:68, title:"Средняя оценка", diff:"hard",
    text:"В задаче 52 мы уже создавали таблицу соответствий между оценками в буквенном и числовом выражении. Сейчас вам нужно будет рассчитать среднюю оценку по произвольному количеству введенных пользователем буквенных оценок. Для окончания ввода можно использовать индикатор в виде пустой строки. Например, если пользователь последовательно введет оценки A, затем C+, а после этого B и пустую строку, средний результат должен составить 3,1.\n\nДля расчетов вам может пригодиться математика из упражнения 52. Никаких проверок на ошибки проводить не нужно. Предположим, что пользователь может вводить только корректные оценки или ноль.",
    example:"Введите оценку: A\nВведите оценку: C+\nВведите оценку: B\nВведите оценку:\nСредняя оценка: 3.1",
    hint:"Переиспользуйте цепочку if-elif соответствия букв и чисел из задачи 52; копите сумму и количество оценок до пустой строки, затем делите.",
    solution:'# Средняя оценка по буквенным оценкам\nA = 4.0\nA_MINUS = 3.7\nB_PLUS = 3.3\nB = 3.0\nB_MINUS = 2.7\nC_PLUS = 2.3\nC = 2.0\nC_MINUS = 1.7\nD_PLUS = 1.3\nD = 1.0\nF = 0\ntotal = 0\ncount = 0\nline = input("Введите буквенную оценку (пустая строка для выхода):")\nwhile line != "":\n    letter = line.upper()\n    if letter == "A+" or letter == "A":\n        gp = A\n    elif letter == "A-":\n        gp = A_MINUS\n    elif letter == "B+":\n        gp = B_PLUS\n    elif letter == "B":\n        gp = B\n    elif letter == "B-":\n        gp = B_MINUS\n    elif letter == "C+":\n        gp = C_PLUS\n    elif letter == "C":\n        gp = C\n    elif letter == "C-":\n        gp = C_MINUS\n    elif letter == "D+":\n        gp = D_PLUS\n    elif letter == "D":\n        gp = D\n    else:\n        gp = F\n    total = total + gp\n    count = count + 1\n    line = input("Введите буквенную оценку (пустая строка для выхода):")\nif count > 0:\n    print("Средняя оценка:", total / count)' },
  { id:69, title:"Билеты в зоопарк", diff:"hard",
    text:"В зоопарке цена входного билета зависит от возраста посетителя. Дети до двух лет допускаются бесплатно. Дети в возрасте от трех до 12 лет могут посещать зоопарк за $14,00. Пенсионерам старше 65 лет вход обойдется в $18,00, а обычный взрослый билет стоит $23,00.\n\nНапишите программу, которая будет запрашивать возраст всех посетителей в группе (по одному за раз) и выводить общую цену билетов для посещения зоопарка этой группой. В качестве индикатора окончания ввода можно по традиции использовать пустую строку. Общую цену билетов стоит выводить в формате с двумя знаками после запятой.",
    hint:"Цикл ввода возрастов до пустой строки; цену билета выбирайте цепочкой if-elif по границам 2, 12 и 64 года.",
    solution:'# Стоимость посещения зоопарка для группы\nBABY_PRICE = 0.00\nCHILD_PRICE = 14.00\nADULT_PRICE = 23.00\nSENIOR_PRICE = 18.00\nBABY_LIMIT = 2\nCHILD_LIMIT = 12\nADULT_LIMIT = 64\ntotal = 0\nline = input("Введите возраст посетителя (пустая строка для окончания ввода):")\nwhile line != "":\n    age = int(line)\n    if age <= BABY_LIMIT:\n        total = total + BABY_PRICE\n    elif age <= CHILD_LIMIT:\n        total = total + CHILD_PRICE\n    elif age <= ADULT_LIMIT:\n        total = total + ADULT_PRICE\n    else:\n        total = total + SENIOR_PRICE\n    line = input("Введите возраст посетителя (пустая строка для окончания ввода):")\nprint("Сумма посещения зоопарка для этой группы составит $%.2f" % total)' },
  { id:70, title:"Биты четности", diff:"mid",
    text:"Определение бита четности – это простой механизм выявления ошибок при передаче данных в условиях низкой надежности соединения, например по телефонной линии. Идея заключается в том, что после передачи каждых восьми бит следом отправляется бит четности, позволяющий определить наличие ошибки при передаче одного бита из восьми.\n\nПри этом можно использовать как контроль четности, так и контроль нечетности. В первом случае бит четности, посылаемый следом за группой из восьми бит данных, выбирается таким образом, чтобы общее количество переданных единичек в числе восьми бит данных и проверочного бита было четным. Во втором случае их количество должно быть нечетным.\n\nНапишите программу, вычисляющую значение бита четности для групп из восьми бит, введенных пользователем, с использованием контроля четности. Пользователь может вводить комбинации из восьми бит бесконечное количество раз, а индикатором окончания ввода пусть снова будет пустая строка. После каждой введенной группы из восьми бит программа должна выводить на экран сообщение о том, чему должен равняться бит четности: 0 или 1. Также осуществляйте контроль ввода и выводите соответствующее сообщение об ошибке, если пользователь ввел последовательность, отличную от восьми бит.",
    bookHint:"Пользователь должен вводить последовательность в виде строки. После ввода вы можете определить количество нулей и единиц во введенной последовательности при помощи метода count. Информацию о работе этого метода можно найти в онлайне.",
    hint:"Проверьте, что строка состоит ровно из 8 символов и только из нулей и единиц (len и count); бит четности равен 0, если единиц четное число, иначе 1.",
    solution:'# Бит четности для групп из восьми бит\nline = input("Введите 8 бит информации:")\nwhile line != "":\n    if line.count("0") + line.count("1") != 8 or len(line) != 8:\n        print("Это не 8 бит... Попробуйте еще.")\n    else:\n        ones = line.count("1")\n        if ones % 2 == 0:\n            print("Бит четности должен иметь значение 0.")\n        else:\n            print("Бит четности должен иметь значение 1.")\n    line = input("Введите 8 бит информации:")' },
  { id:71, title:"Приблизительное число π", diff:"mid",
    text:"Приблизительное значение числа π можно вычислить по следующей бесконечной формуле:",
    formula:"π ≈ 3 + 4/(2·3·4) − 4/(4·5·6) + 4/(6·7·8) − …",
    text2:"Напишите программу, выводящую на экран 15 приближений числа π. В первом приближении должно быть использовано только первое слагаемое приведенного бесконечного ряда. Каждое очередное приближение должно учитывать следующее слагаемое, тем самым увеличивая точность расчета.",
    hint:"Начните с pi = 3; очередное слагаемое — 4 / ((2i)·(2i+1)·(2i+2)) при i = 1, 2, 3…; знак чередуется: плюс, минус, плюс.",
    solution:'# Пятнадцать приближений числа пи\npi = 3\nprint("Приближение 1: %.10f" % pi)\nsign = 1\nfor i in range(1, 15):\n    term = 4 / ((2 * i) * (2 * i + 1) * (2 * i + 2))\n    pi = pi + sign * term\n    sign = -sign\n    print("Приближение %d: %.10f" % (i + 1, pi))' },
  { id:72, title:"Игра Fizz-Buzz", diff:"mid",
    text:"Fizz-Buzz – это известная игра, помогающая детям освоить в игровой форме правила деления. Участники садятся в круг, чтобы игра теоретически могла продолжаться бесконечно. Первый игрок говорит «Один» и передает ход тому, кто слева. Каждый следующий игрок должен мысленно прибавить к предыдущему числу единицу и произнести либо его, либо одно из ключевых слов: Fizz, если число без остатка делится на три, или Buzz, если на пять. Если соблюдаются оба этих условия, он произносит Fizz-Buzz. Игрок, не сумевший сказать правильное слово, выбывает из игры. Последний оставшийся игрок признается победителем.\n\nРазработайте программу, реализующую алгоритм игры Fizz-Buzz применительно к первым 100 числам. Каждый следующий ответ должен отображаться на новой строке.",
    hint:"Сначала проверяйте делимость сразу на 3 и на 5 (иначе ветки Fizz и Buzz перехватят эти числа), затем на 3, затем на 5.",
    solution:'# Игра Fizz-Buzz для первых 100 чисел\nfor n in range(1, 101):\n    if n % 3 == 0 and n % 5 == 0:\n        print("Fizz-Buzz")\n    elif n % 3 == 0:\n        print("Fizz")\n    elif n % 5 == 0:\n        print("Buzz")\n    else:\n        print(n)' },
  { id:73, title:"Код Цезаря", diff:"hard",
    text:"Одним из первых в истории примеров шифрования считаются закодированные послания Юлия Цезаря. Римскому полководцу необходимо было посылать письменные приказы своим генералам, но он не желал, чтобы в случае чего их прочитали недруги. В результате он стал шифровать свои послания довольно простым методом, который впоследствии стали называть кодом Цезаря.\n\nИдея шифрования была совершенно тривиальной и заключалась в циклическом сдвиге букв на три позиции. В итоге буква A превращалась в D, B – в E, C – в F и т. д. Последние три буквы алфавита переносились на начало. Таким образом, буква X становилась A, Y – B, а Z – C. Цифры и другие символы не подвергались шифрованию.\n\nНапишите программу, реализующую код Цезаря. Позвольте пользователю ввести фразу и количество символов для сдвига, после чего выведите результирующее сообщение. Убедитесь в том, что ваша программа шифрует как строчные, так и прописные буквы. Также должна быть возможность указывать отрицательный сдвиг, чтобы можно было использовать вашу программу для расшифровки фраз.",
    hint:"Для буквы определите позицию в алфавите pos = ord(ch) − ord('a'), новую позицию (pos + shift) % 26 и верните символ через chr; не-буквы копируйте без изменений.",
    solution:'# Код Цезаря с произвольным сдвигом\nmessage = input("Введите сообщение:")\nshift = int(input("Введите сдвиг:"))\nnew_message = ""\nfor ch in message:\n    if ch >= "a" and ch <= "z":\n        pos = ord(ch) - ord("a")\n        pos = (pos + shift) % 26\n        new_message = new_message + chr(pos + ord("a"))\n    elif ch >= "A" and ch <= "Z":\n        pos = ord(ch) - ord("A")\n        pos = (pos + shift) % 26\n        new_message = new_message + chr(pos + ord("A"))\n    else:\n        new_message = new_message + ch\nprint("Новое сообщение", new_message)' },
  { id:74, title:"Квадратный корень", diff:"easy",
    text:"Напишите программу, реализующую метод Ньютона для нахождения квадратного корня числа x, введенного пользователем. Алгоритм реализации метода Ньютона следующий:",
    steps:[
      "запрашиваем число x у пользователя;",
      "присваиваем переменной guess значение x / 2;",
      "пока значение переменной guess не будет обладать должной точностью, присваиваем переменной guess результат вычисления среднего между guess и x / guess."
    ],
    after:"По завершении алгоритма в переменной guess будет находиться определенное приближение вычисления квадратного корня из x. Качество аппроксимации при этом будет зависеть только от вашего желания. В нашем случае расхождение между значениями guess * guess и x должно составлять не более 10⁻¹².",
    hint:"Условие выхода из цикла while: abs(guess * guess − x) > 1e-12; новое приближение guess = (guess + x / guess) / 2.",
    solution:'# Квадратный корень методом Ньютона\nx = float(input("Введите число: "))\nguess = x / 2\nwhile abs(guess * guess - x) > 1e-12:\n    guess = (guess + x / guess) / 2\nprint("Квадратный корень из", x, "примерно равен", guess)' },
  { id:75, title:"Палиндром или нет?", diff:"mid",
    text:"Строка называется палиндромом, если она пишется одинаково в обоих направлениях. Например, палиндромами в английском языке являются слова «anna», «civic», «level», «hannah». Напишите программу, запрашивающую у пользователя строку и при помощи цикла определяющую, является ли она палиндромом.",
    note:"Яибофобия (Aibohphobia) – это безрассудный страх палиндромов. Эти слова в русском и английском сами по себе являются палиндромами, что и привело к их образованию. Напротив, яилифилия (ailihphilia) характеризуется любовью к палиндромам. Объяснять образование этого слова нет нужды.",
    hint:"Сравнивайте символы с двух концов: line[i] и line[len(line) − i − 1], двигаясь к середине; при первом несовпадении строка — не палиндром.",
    solution:'# Определение палиндрома\nline = input("Введите строку:")\nis_palindrome = True\ni = 0\nwhile i < len(line) / 2 and is_palindrome:\n    if line[i] != line[len(line) - i - 1]:\n        is_palindrome = False\n    i = i + 1\nif is_palindrome:\n    print(line, " – это палиндром")\nelse:\n    print(line, " – это не палиндром")' },
  { id:76, title:"Многословные палиндромы", diff:"hard",
    text:"Помимо слов, существуют целые фразы, являющиеся палиндромами, если не обращать внимания на пробелы. Вот лишь несколько примеров на английском: «go dog», «flee to me remote elf» and «some men interpret nine memos». Русские варианты есть следующие: «А кобыле цена дана, да не целы бока», «А Луна канула» и другие. Расширьте свое решение упражнения под номером 75, чтобы при вынесении решения о том, является ли строка палиндромом, игнорировались пробелы. Также можете поработать над тем, чтобы игнорировались знаки препинания, а заглавные и прописные буквы считались эквивалентными.",

var DIFF_LABEL = { easy:"легкая", mid:"средняя", hard:"сложная" };

var LS_STATE = "python-task3-state-v1";
var LS_PROGRESS = "python-trainer-progress-v1";

/* ================= STATE ================= */
var state = {
  screen:"start",
  tab:"ref",               // ref | tasks | report
  student:{last:"", first:"", cls:""},
  startErrors:null,
  codes:{},
  hintShown:{}, hintUsed:{},
  etalonShown:{}, etalonViewed:{}, etalonNoAttempt:{}, etalonConfirm:{},
  solved:{},
  open:{},
  filter:"all",            // all | todo | done
  query:"",
  reportOpen:false
};
function loadSaved(){
  try{
    var raw = localStorage.getItem(LS_STATE);
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s.student) state.student = s.student;
    if(s.codes) state.codes = Object.assign(state.codes, s.codes);
    if(s.hintUsed) state.hintUsed = Object.assign(state.hintUsed, s.hintUsed);
    if(s.etalonViewed) state.etalonViewed = Object.assign(state.etalonViewed, s.etalonViewed);
    if(s.etalonNoAttempt) state.etalonNoAttempt = Object.assign(state.etalonNoAttempt, s.etalonNoAttempt);
    if(s.solved) state.solved = Object.assign(state.solved, s.solved);
    if(s.reportOpen) state.reportOpen = true;
  }catch(e){}
}
function persist(){
  try{
    localStorage.setItem(LS_STATE, JSON.stringify({
      student:state.student, codes:state.codes,
      hintUsed:state.hintUsed, etalonViewed:state.etalonViewed,
      etalonNoAttempt:state.etalonNoAttempt, solved:state.solved,
      reportOpen:state.reportOpen
    }));
  }catch(e){}
}
function setProgress(status){
  try{
    var raw = localStorage.getItem(LS_PROGRESS);
    var p = raw ? JSON.parse(raw) : {topic:{}, task:{}};
    p.task = p.task || {};
    p.task[String(META.num)] = status;
    localStorage.setItem(LS_PROGRESS, JSON.stringify(p));
  }catch(e){}
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
  });
}
function hlPy(src){
  return esc(src).replace(
    /(#.*$)|(&quot;(?:[^&\\]|\\.)*?&quot;|&#39;(?:[^&\\]|\\.)*?&#39;)|\b(from|import|def|return|if|elif|else|for|while|in|and|or|not|True|False|pass|break|continue|try|except|with|as|lambda|global|None)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()/gm,
    function(m, com, str, kw, num, fn){
      if(com) return '<span class="tk-c">' + com + '</span>';
      if(str) return '<span class="tk-s">' + str + '</span>';
      if(kw)  return '<span class="tk-k">' + kw + '</span>';
      if(num) return '<span class="tk-n">' + num + '</span>';
      if(fn)  return '<span class="tk-f">' + fn + '</span>';
      return m;
    });
}
function codeWindow(src, file){
  return '<div class="code-window"><div class="code-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="file">' + (file || "program.py") + '</span></div><pre class="code">' + hlPy(src) + '</pre></div>';
}
/* счётчики */
function solvedCount(){ return TASKS.filter(function(t){ return state.solved[t.id]; }).length; }
function codeCount(){ return TASKS.filter(function(t){ return (state.codes[t.id] || "").trim(); }).length; }
function hintCount(){ return TASKS.filter(function(t){ return state.hintUsed[t.id]; }).length; }
function etalonCount(){ return TASKS.filter(function(t){ return state.etalonViewed[t.id]; }).length; }
function touched(t){
  return (state.codes[t.id] || "").trim() || state.hintUsed[t.id] || state.etalonViewed[t.id] || state.solved[t.id];
}
function doneThreshold(){ return Math.ceil(TASKS.length * DONE_SHARE); }

/* ================= RENDER ================= */
var app = document.getElementById("app");

function parasHTML(s){
  return s.split("\n\n").map(function(p){ return '<p class="task-text">' + esc(p) + '</p>'; }).join("");
}
function formulaHTML(f){
  var arr = Array.isArray(f) ? f : [f];
  return arr.map(function(x){ return '<div class="formula">' + esc(x) + '</div>'; }).join("");
}
function tableHTML(t){
  return '<div class="tbl-wrap"><table><thead><tr>' +
    t.head.map(function(h){ return "<th>" + esc(h) + "</th>"; }).join("") +
    '</tr></thead><tbody>' +
    t.rows.map(function(r){
      return "<tr>" + r.map(function(c){ return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>";
    }).join("") + '</tbody></table></div>';
}

    return '<div class="card"><h3>' + esc(c.t) + '</h3><p>' + esc(c.p) + '</p>' + codeWindow(c.code, "spravka.py") + '</div>';
  }).join("");
  return '<div class="container"><p class="section-note">Только то, что нужно для задач главы: циклы while и for, вложенные циклы и типовые приёмы накопления результата. Полная теория — в блоке 3 курса.</p>' + cards +
    '<div class="call info"><span class="call-ic" aria-hidden="true">💡</span><div><p>Во всех задачах пишите комментарии и понятные имена переменных — как в примерах сборника. Код автосохраняется в этом браузере.</p></div></div></div>';
}
function taskCard(t){
  var open = !!state.open[t.id];
  var solved = !!state.solved[t.id];
  var tags = '<span class="tag ' + t.diff + '">' + DIFF_LABEL[t.diff] + '</span>' +
    (solved ? '<span class="tag solved">решено</span>' : '');
  var body = "";
  if(open){
    body = '<div class="task-body">' +
      parasHTML(t.text) +
      (t.bullets ? '<ul class="task-list">' + t.bullets.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join("") + '</ul>' : '') +
      (t.table ? tableHTML(t.table) : '') +
      (t.formula ? formulaHTML(t.formula) : '') +
      (t.text2 ? parasHTML(t.text2) : '') +
      (t.steps ? '<ol class="task-steps">' + t.steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") + '</ol>' : '') +
      (t.after ? parasHTML(t.after) : '') +
      (t.note ? '<div class="call warn"><span class="call-ic" aria-hidden="true">⚠️</span><div><p><b>Примечание.</b> ' + esc(t.note) + '</p></div></div>' : '') +
      (t.bookHint ? '<div class="call info"><span class="call-ic" aria-hidden="true">📌</span><div>' +
        (Array.isArray(t.bookHint) ? t.bookHint : [t.bookHint]).map(function(h){ return '<p><b>Подсказка.</b> ' + esc(h) + '</p>'; }).join("") +
        '</div></div>' : '') +
      (t.example ? '<div class="screen"><span class="screen-label">Пример</span><pre>' + esc(t.example) + '</pre></div>' : '') +
      '<p class="label-sm" id="codeLbl' + t.id + '">Мой код</p>' +
      '<textarea class="code-input" data-code="' + t.id + '" rows="7" spellcheck="false" aria-labelledby="codeLbl' + t.id + '" placeholder="Введите здесь свой код на Python">' + esc(state.codes[t.id] || "") + '</textarea>' +
      '<div class="task-actions">' +
        '<button class="btn-small' + (state.hintShown[t.id] ? " on" : "") + '" type="button" data-act="toggle-hint" data-id="' + t.id + '">💡 Подсказка</button>' +
        '<button class="btn-small' + (state.etalonShown[t.id] ? " on" : "") + '" type="button" data-act="etalon" data-id="' + t.id + '">Эталон решения</button>' +
        '<button class="btn-small' + (solved ? " on" : "") + '" type="button" data-act="toggle-solved" data-id="' + t.id + '">' + (solved ? "✓ Решено" : "Отметить решённой") + '</button>' +
      '</div>' +
      (state.hintShown[t.id] ? '<div class="hint"><span class="hint-ic" aria-hidden="true">💡</span><div><p><b>Подсказка.</b> ' + esc(t.hint) + '</p></div></div>' : '') +
      (state.etalonConfirm[t.id] ? '<div class="confirm"><p>В поле «Мой код» пока пусто. Показать эталон без своей попытки? Это попадёт в отчёт.</p><div class="task-actions" style="margin:0"><button class="btn-small warnbtn" type="button" data-act="etalon-yes" data-id="' + t.id + '">Да, показать</button><button class="btn-small" type="button" data-act="etalon-no" data-id="' + t.id + '">Отмена</button></div></div>' : '') +
      (state.etalonShown[t.id] && state.etalonViewed[t.id] ? '<div class="etalon"><p class="label-sm">Эталон решения</p>' + codeWindow(t.solution, "task" + t.id + ".py") + '</div>' : '') +
    '</div>';
  }
  return '<div class="task-card">' +
    '<button class="task-head-btn" type="button" data-act="toggle-open" data-id="' + t.id + '" aria-expanded="' + open + '">' +
      '<span class="task-num">' + t.id + '</span>' +
      '<span class="task-title">' + esc(t.title) + '</span>' +
      '<span class="task-tags">' + tags + '</span>' +
      '<span class="chev" aria-hidden="true">' + (open ? "▴" : "▾") + '</span>' +
    '</button>' + body + '</div>';
}
function renderTasks(){
  var q = state.query.trim().toLowerCase();
  var list = TASKS.filter(function(t){
    if(state.filter === "todo" && state.solved[t.id]) return false;
    if(state.filter === "done" && !state.solved[t.id]) return false;
    if(q && String(t.id) !== q && t.title.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  var solved = solvedCount();
  var pct = Math.round(solved / TASKS.length * 100);
  var first = TASKS[0].id, lastN = TASKS[TASKS.length - 1].id;
  var toolbar =
    '<div class="progline"><span>Решено: <b>' + solved + ' из ' + TASKS.length + '</b></span><span><b>' + pct + '%</b> главы</span></div>' +
    '<div class="sum-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
    '<div class="toolbar">' +
      '<input class="search" id="taskSearch" type="search" value="' + esc(state.query) + '" placeholder="Поиск: номер или название задачи" aria-label="Поиск задач">' +
      '<button class="fchip" type="button" data-filter="all" aria-pressed="' + (state.filter === "all") + '">Все</button>' +
      '<button class="fchip" type="button" data-filter="todo" aria-pressed="' + (state.filter === "todo") + '">Нерешённые</button>' +
      '<button class="fchip" type="button" data-filter="done" aria-pressed="' + (state.filter === "done") + '">Решённые</button>' +
    '</div>';
  var cards = list.length
    ? list.map(taskCard).join("")
    : '<div class="empty-list">По вашему запросу ничего не нашлось. Сбросьте поиск или выберите фильтр «Все».</div>';
  return '<div class="container"><p class="section-note">Упражнения ' + first + '–' + lastN + ' главы ' + META.num + ' сборника Б. Стивенсона: условия приведены по книге, включая формулы, алгоритмы, примеры, подсказки и примечания автора. Раскройте задачу, напишите код, при необходимости возьмите подсказку. Эталон откроется после своей попытки кода — либо с отметкой в отчёте.</p>' + toolbar + cards + '</div>';
}
function sumRow(icon, label, value, pct, note){
  return '<div class="sum-row"><span class="sum-ic" aria-hidden="true">' + icon + '</span><div class="sum-body">' +
    '<div class="sum-top"><b>' + label + '</b><span>' + value + '</span></div>' +
    '<div class="sum-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
    (note ? '<p class="sum-note">' + note + '</p>' : '') +
    '</div></div>';
}
function renderSummary(){
  var solved = solvedCount(), code = codeCount(), hints = hintCount(), etal = etalonCount();
  var th = doneThreshold();
  var warns = [];
  if(code === 0) warns.push("Пока нет кода ни к одной задаче.");
  if(solved < th) warns.push("До зачёта главы не хватает решённых задач: нужно " + th + " из " + TASKS.length + " (сейчас " + solved + ").");
  return '<div class="container">' +
    '<p class="section-note">Сводка работы за главу. Глава считается пройденной, когда отмечено решёнными не менее ' + Math.round(DONE_SHARE * 100) + '% задач (' + th + ' из ' + TASKS.length + ') и нажата кнопка завершения.</p>' +
    '<div class="sum-card">' +
      sumRow("💻", "Код написан", code + " из " + TASKS.length + " задач", Math.round(code / TASKS.length * 100), "Поле «Мой код» непустое.") +
      sumRow("✅", "Отмечено решёнными", solved + " из " + TASKS.length, Math.round(solved / TASKS.length * 100), "Порог зачёта главы: " + th + " задач.") +
      sumRow("💡", "Подсказки", "использовано " + hints, Math.round(hints / TASKS.length * 100), "Подсказка фиксируется в отчёте.") +
      sumRow("📖", "Эталоны", "просмотрено " + etal, Math.round(etal / TASKS.length * 100), "Просмотр без своей попытки помечается отдельно.") +
    '</div>' +
    (warns.length
      ? '<div class="call warn" style="margin-top:16px"><span class="call-ic" aria-hidden="true">⚠️</span><div><p><b>Обратите внимание:</b></p><ul style="margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;">' + warns.map(function(w){ return "<li>" + w + "</li>"; }).join("") + '</ul></div></div>'
      : '<div class="call ok" style="margin-top:16px"><span class="call-ic" aria-hidden="true">🎉</span><div><p>Порог главы достигнут — можно завершать урок и сохранять отчёт!</p></div></div>') +
    '<div class="sum-actions"><button class="btn btn-primary" type="button" data-act="finish">Завершить урок и открыть отчёт</button></div>' +
    '<p class="hint-print" style="margin:10px 0 40px">В отчёт попадут только задачи, с которыми вы работали: ваш код и отметки о подсказках и эталонах.</p>' +
  '</div>';
}
function renderReport(){
  var st = state.student;
  var date = new Date().toLocaleDateString("ru-RU");
  var solved = solvedCount();
  var passed = solved >= doneThreshold();
  var touchedList = TASKS.filter(touched);
  var tasks = touchedList.length
    ? touchedList.map(function(t){
        return '<h3>Задача ' + t.id + '. ' + esc(t.title) + '</h3>' +
          '<p class="rep-note">Решена: <b>' + (state.solved[t.id] ? "да" : "нет") + '</b> · Подсказка: <b>' + (state.hintUsed[t.id] ? "да" : "нет") + '</b> · Эталон: <b>' + (state.etalonViewed[t.id] ? (state.etalonNoAttempt[t.id] ? "да, без своей попытки" : "да") : "нет") + '</b></p>' +
          '<p class="label-sm">Мой код</p><pre>' + ((state.codes[t.id] || "").trim() ? esc(state.codes[t.id]) : "— код не предоставлен —") + '</pre>';
      }).join("")
    : '<p class="rep-note">Работ с задачами не зафиксировано.</p>';
  return '<div class="container"><div class="report" id="reportSheet">' +
    '<h2>Отчёт по практике</h2>' +
    '<div class="meta">' +
      '<span><b>Глава:</b> ' + META.num + '. ' + META.topic + ' (сборник Б. Стивенсона)</span>' +
      '<span><b>Автор курса:</b> ' + META.author + '</span>' +
      '<span><b>Ученик:</b> ' + esc(st.last) + ' ' + esc(st.first) + '</span>' +
      '<span><b>Класс:</b> ' + esc(st.cls) + '</span>' +
      '<span><b>Дата:</b> ' + date + '</span>' +
      '<span><b>Решено задач:</b> ' + solved + ' из ' + TASKS.length + ' · глава зачтена: ' + (passed ? "да" : "нет") + '</span>' +
      '<span><b>Подсказок:</b> ' + hintCount() + ' · <b>эталонов:</b> ' + etalonCount() + ' · задач с кодом: ' + codeCount() + '</span>' +
    '</div>' +
    '<h3>Выполненные работы</h3>' + tasks +
    '</div>' +
    '<div class="report-actions no-print"><button class="btn btn-primary" type="button" data-act="print">Сохранить отчёт в PDF</button></div>' +
    '<p class="hint-print no-print">Откроется окно печати — выберите «Сохранить как PDF». В отчёт входят только задачи, с которыми была работа.</p>' +
    '</div>';
}
function renderLesson(){
  var st = state.student;
  var tabs = [
    ["ref", "Справка"],
    ["tasks", "Задачи"],
    ["report", state.reportOpen ? "Отчёт" : "Итоги"]
  ];
  var body = state.tab === "ref" ? renderRef()
    : state.tab === "tasks" ? renderTasks()
    : (state.reportOpen ? renderReport() : renderSummary());
  return '<div class="container no-print"><div class="lesson-head">' +
    '<h1>Глава ' + META.num + '. ' + META.topic + '</h1>' +
    '<button class="chip-student" type="button" data-act="edit-student" title="Изменить данные ученика">' + esc(st.last) + ' ' + esc(st.first) + ' · ' + esc(st.cls) + ' ✎</button>' +
    '</div>' +
    '<div class="tabs" role="tablist" aria-label="Разделы практики">' +
    tabs.map(function(t){
      return '<button class="tab" role="tab" type="button" aria-selected="' + (state.tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join("") +
    '</div></div>' + body;
}
function render(){
  app.innerHTML = state.screen === "start" ? renderStart() : renderLesson();
}

/* ================= HANDLERS ================= */
var toastEl = null, toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
}
function onStartSubmit(e){
  e.preventDefault();
  var f = e.target;
  var last = f.last.value.trim(), first = f.first.value.trim(), cls = f.cls.value.trim();
  var errs = {};
  if(last.length < 2) errs.last = "Введите фамилию (минимум 2 символа).";
  if(first.length < 2) errs.first = "Введите имя (минимум 2 символа).";
  if(!cls) errs.cls = "Введите класс, например 9А.";
  state.student = {last:last, first:first, cls:cls};
  if(Object.keys(errs).length){
    state.startErrors = errs;
    render();
    var bad = app.querySelector("input.bad");
    if(bad) bad.focus();
    return;
  }
  state.startErrors = null;
  state.screen = "lesson";
  state.tab = "ref";
  setProgress("progress");
  persist();
  render();
  showToast("Практика начата: " + TASKS.length + " задачи впереди!");
}
function onAppClick(e){
  var tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){
    state.tab = tabBtn.dataset.tab;
    render();
    window.scrollTo(0, 0);
    return;
  }
  var fBtn = e.target.closest("[data-filter]");
  if(fBtn){
    state.filter = fBtn.dataset.filter;
    render();
    return;
  }
  var btn = e.target.closest("[data-act]");
  if(!btn) return;
  var act = btn.dataset.act;
  var id = Number(btn.dataset.id || 0);
  if(act === "toggle-open"){
    state.open[id] = !state.open[id];
    render();
  }
  else if(act === "toggle-hint"){
    var nowH = !state.hintShown[id];
    state.hintShown[id] = nowH;
    if(nowH) state.hintUsed[id] = true;
    persist();
    render();
  }
  else if(act === "toggle-solved"){
    state.solved[id] = !state.solved[id];
    persist();
    setProgress(solvedCount() >= doneThreshold() ? "done" : "progress");
    render();
    showToast(state.solved[id] ? "Задача " + id + " отмечена решённой." : "Отметка снята с задачи " + id + ".");
  }
  else if(act === "etalon"){
    if(state.etalonViewed[id]){
      state.etalonShown[id] = !state.etalonShown[id];
    }else if((state.codes[id] || "").trim()){
      state.etalonViewed[id] = true;
      state.etalonShown[id] = true;
      persist();
    }else{
      state.etalonConfirm[id] = true;
    }
    render();
  }
  else if(act === "etalon-yes"){
    state.etalonViewed[id] = true;
    state.etalonNoAttempt[id] = true;
    state.etalonShown[id] = true;
    state.etalonConfirm[id] = false;
    persist();
    render();
  }
  else if(act === "etalon-no"){
    state.etalonConfirm[id] = false;
    render();
  }
  else if(act === "finish"){
    state.reportOpen = true;
    state.tab = "report";
    setProgress(solvedCount() >= doneThreshold() ? "done" : "progress");
    persist();
    render();
    window.scrollTo(0, 0);
    showToast("Урок завершён! Отчёт готов к сохранению в PDF.");
  }
  else if(act === "edit-student"){ state.screen = "start"; render(); window.scrollTo(0, 0); }
  else if(act === "print"){ window.print(); }
}
function onAppInput(e){
  var ta = e.target.closest("textarea[data-code]");
  if(ta){
    state.codes[Number(ta.dataset.code)] = ta.value;
    persist();
    return;
  }
  if(e.target.id === "taskSearch"){
    state.query = e.target.value;
    render();
    var el = document.getElementById("taskSearch");
    if(el){
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    }
  }
}

/* ================= INIT ================= */
function init(){
  loadSaved();
  if(state.student.last){
    setProgress(solvedCount() >= doneThreshold() ? "done" : "progress");
  }
  toastEl = document.createElement("div");
  toastEl.className = "toast";
  toastEl.setAttribute("role", "status");
  toastEl.setAttribute("aria-live", "polite");
  document.body.appendChild(toastEl);
  render();
  app.addEventListener("click", onAppClick);
  app.addEventListener("input", onAppInput);
  app.addEventListener("submit", onStartSubmit);
}
try{
  init();
}catch(err){
  app.innerHTML = '<div class="fatal">Ошибка при запуске: ' + err.message + '</div>';
}
</script>
</body>
</html>
