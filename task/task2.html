<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Практика · Глава 2 — Python‑тренажер</title>
<style>
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --accent:#0071e3;
  --accent-dark:#005bb9;
  --danger:#c22a1e;
  --ok:#1c7c3c;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 8px 24px rgba(0,0,0,.06);
  --shadow-lift:0 14px 34px rgba(0,0,0,.10);
  --border:rgba(0,0,0,.07);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:clip;
}
.container{width:100%;max-width:960px;margin:0 auto;padding-left:20px;padding-right:20px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:#fff;color:var(--accent);padding:12px 18px;border-radius:0 0 12px 0;font-weight:600;text-decoration:none}
.skip:focus{left:0}
b{font-weight:700}
.fatal{padding:40px 20px;font-family:var(--mono);font-size:14px;color:var(--danger);white-space:pre-wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:none;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s ease,transform .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-small{min-height:44px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text)}
.btn-small:hover{background:#f5f5f7}

.start-card{max-width:560px;margin:44px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.eyebrow{color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.start-card h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.author{color:var(--muted);margin:0 0 18px;font-size:15px}
.start-list{margin:0 0 22px;padding-left:20px;color:var(--muted);font-size:14.5px;display:grid;gap:6px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600}
.field input{min-height:48px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;color:var(--text);width:100%}
.field input:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.field input.bad{border-color:var(--danger);box-shadow:0 0 0 3px rgba(194,42,30,.12)}
.err{color:var(--danger);font-size:13px;margin:0}

.lesson-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0 10px}
.lesson-head h1{font-size:20px;margin:0;letter-spacing:-.01em;flex:1 1 auto;min-width:160px}
.chip-student{min-height:44px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:0 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.chip-student:hover{background:#f5f5f7}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:#f5f5f7}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.section-note{color:var(--muted);font-size:14.5px;margin:14px 0 18px;max-width:760px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:0 0 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:17px}
.card p{margin:0 0 10px;font-size:14.5px;line-height:1.6}
.call{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:12px 14px;margin:0 0 12px;border:1px solid}
.call p{margin:0;font-size:14px;line-height:1.6;min-width:0}
.call>div{min-width:0}
.call-ic{font-size:20px;line-height:1.4;flex:none}
.call.info{background:rgba(0,113,227,.07);border-color:rgba(0,113,227,.25)}
.call.warn{background:rgba(255,159,10,.1);border-color:rgba(255,159,10,.35)}
.call.ok{background:rgba(52,199,89,.1);border-color:rgba(52,199,89,.35)}
.code-window{background:#161617;border-radius:14px;overflow:hidden;margin:0 0 12px;box-shadow:var(--shadow);min-width:0}
.code-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#1d1d1f}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.code-bar .file{margin-left:6px;color:#98989d;font-family:var(--mono);font-size:12px}
pre.code{margin:0;padding:14px 16px;color:#f5f5f7;font-family:var(--mono);font-size:13px;line-height:1.65;overflow-x:auto;white-space:pre;max-width:100%}
.tk-c{color:#83838a}.tk-k{color:#ff7ab2}.tk-s{color:#ffa740}.tk-n{color:#d9bf69}.tk-f{color:#6bdfff}
.screen{background:rgba(52,199,89,.08);border:1px solid rgba(52,199,89,.35);border-radius:12px;padding:10px 14px;margin:0 0 12px;min-width:0}
.screen-label{display:block;font-size:11.5px;font-weight:700;color:var(--ok);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.screen pre{margin:0;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;color:var(--text)}
.tbl-wrap{overflow-x:auto;margin:0 0 12px;border:1px solid var(--border);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px;background:#fff}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
th{background:#f5f5f7;font-weight:700}
tr:last-child td{border-bottom:none}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.search{min-height:44px;border:1px solid var(--border);border-radius:999px;padding:0 18px;font-size:14.5px;background:#fff;color:var(--text);flex:1 1 200px;min-width:0}
.search:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.fchip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.fchip[aria-pressed="true"]{background:rgba(0,113,227,.1);border-color:var(--accent);color:var(--accent-dark)}
.progline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:10px 0 6px}
.progline b{color:var(--text)}
.sum-bar{height:8px;background:#e8e8ed;border-radius:999px;overflow:hidden;margin:0 0 16px}
.sum-bar i{display:block;height:100%;background:linear-gradient(90deg,#37a0ff,var(--accent));border-radius:999px;transition:width .3s ease}

.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 12px;min-width:0;overflow:hidden}
.task-head-btn{display:flex;width:100%;background:none;border:none;cursor:pointer;gap:10px;align-items:center;padding:16px 18px;text-align:left;min-height:56px}
.task-head-btn:hover{background:rgba(0,0,0,.03)}
.task-num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);background:rgba(0,113,227,.1);border-radius:8px;padding:4px 9px;flex:none}
.task-title{font-size:15.5px;font-weight:600;flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.task-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;color:#48484a;background:#e8e8ed;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.easy{background:rgba(52,199,89,.16);color:#1c7c3c}
.tag.mid{background:rgba(255,159,10,.16);color:#8a5a00}
.tag.hard{background:rgba(255,69,58,.14);color:#b3261e}
.tag.solved{background:rgba(52,199,89,.16);color:#1c7c3c;font-weight:700}
.chev{color:var(--muted);font-size:14px;flex:none}
.task-body{padding:4px 18px 18px;border-top:1px solid var(--border)}
.task-text{margin:0 0 10px;font-size:14.5px;line-height:1.65}
.formula{background:#f5f5f7;border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:0 0 12px;font-family:var(--mono);font-size:13.5px;text-align:center;overflow-x:auto;white-space:pre-wrap}
.task-list{margin:0 0 12px;padding-left:20px;display:grid;gap:4px;font-size:14.5px}
.task-steps{margin:0 0 12px;padding-left:22px;display:grid;gap:4px;font-size:14px;line-height:1.55}
.task-steps li::marker{color:var(--accent);font-weight:700}
.label-sm{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
textarea.code-input{width:100%;min-height:150px;resize:vertical;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.6;background:#fff;color:var(--text)}
textarea.code-input:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn-small.on{background:rgba(52,199,89,.14);border-color:rgba(52,199,89,.5);color:#1c7c3c}
.btn-small.warnbtn{color:#8a5a00;border-color:rgba(255,159,10,.5)}
.hint{display:flex;gap:12px;background:rgba(255,159,10,.09);border:1px solid rgba(255,159,10,.35);border-radius:14px;padding:12px 14px;margin:10px 0 4px}
.hint>div{min-width:0;flex:1}
.hint-ic{font-size:20px;flex:none;line-height:1.4}
.hint p{margin:0;font-size:14px;line-height:1.6}
.hint .code-window{margin:10px 0 0}
.hint .code-bar{padding:8px 12px}
.hint pre.code{padding:12px 14px;font-size:12.5px}
.etalon{margin:10px 0 4px}
.etalon .code-window{margin:0}
.confirm{background:rgba(194,42,30,.07);border:1px solid rgba(194,42,30,.35);border-radius:14px;padding:12px 14px;margin:10px 0 4px;font-size:14px}
.confirm p{margin:0 0 10px}
.empty-list{color:var(--muted);font-size:14.5px;padding:18px;border:1px dashed var(--border);border-radius:var(--radius);text-align:center}

.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px;display:grid;gap:18px}
.sum-row{display:flex;gap:14px;align-items:flex-start}
.sum-ic{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(0,113,227,.1);display:grid;place-items:center;font-size:20px}
.sum-body{flex:1;min-width:0}
.sum-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px;margin-bottom:6px}
.sum-top b{font-size:15px}
.sum-note{color:var(--muted);font-size:13px;margin:6px 0 0}
.sum-actions{display:flex;justify-content:center;margin:22px 0 6px}

.report{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;max-width:820px;margin:16px auto 0;min-width:0}
.report h2{margin:0 0 4px;font-size:24px}
.report .meta{display:grid;gap:4px;font-size:14.5px;margin:12px 0 6px}
.report h3{font-size:16px;margin:18px 0 6px}
.report pre{background:#f5f5f7;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
.report .rep-note{color:var(--muted);font-size:13px;margin:6px 0}
.report-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 4px}
.hint-print{color:var(--muted);font-size:13.5px;text-align:center;margin:0 0 40px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:100;box-shadow:var(--shadow-lift);max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .container{padding:0;max-width:100%}
  .report{border:none;box-shadow:none;margin:0;padding:0;max-width:100%}
  .report pre{white-space:pre-wrap;word-break:break-word}
}
@media (max-width:640px){
  .card{padding:16px}
  .task-head-btn{padding:14px}
  .task-body{padding:4px 14px 14px}
  pre.code{font-size:12px;padding:12px}
  .sum-card{padding:16px}
  .task-tags{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
</style>
</head>
<body>
<a class="skip no-print" href="#main">Перейти к содержимому</a>
<div id="app"></div>
<script>
/* аварийный экран: если основной скрипт упадёт, покажем текст ошибки вместо пустоты */
window.addEventListener("error", function(ev){
  var a = document.getElementById("app");
  if(a && !a.innerHTML.trim()){
    a.innerHTML = '<div class="fatal">Ошибка скрипта: ' + (ev.message || "неизвестная") + '</div>';
  }
});
</script>
<script>
"use strict";
/* ================= CONSTANTS ================= */
var META = { num:2, topic:"Принятие решений", author:"Масликов М.М." };
var DONE_SHARE = 0.6;

/* Краткая справка по главе 2 */
var REF_CARDS = [
  { t:"Выражения if",
    p:"Ветвление в Python начинается с ключевого слова if: тело выполняется, только если условие истинно (True); при False тело пропускается. Тело пишется с отступом, блок заканчивается при выравнивании отступа.",
    code:'# Запрашиваем значение у пользователя\nnum = float(input("Введите число:"))\nif num == 0:\n    result = "Введен ноль"\nif num != 0:\n    result = "Введен не ноль"\nprint(result)' },
  { t:"if-else: взаимоисключающие условия",
    p:"Если из двух условий всегда выполняется ровно одно, используют if-else: при True работает тело if, иначе — тело else. Это короче и надёжнее двух последовательных if.",
    code:'if num == 0:\n    result = "Введен ноль"\nelse:\n    result = "Введен не ноль"\nprint(result)' },
  { t:"if-elif-else: выбор из альтернатив",
    p:"Цепочка elif проверяет условия по очереди; выполнится только одно тело. Блок else необязателен: без него при всех ложных условиях не выполнится ничего.",
    code:'if num > 0:\n    result = "Введено положительное число"\nelif num < 0:\n    result = "Введено отрицательное число"\nelse:\n    result = "Введен ноль"\nprint(result)' },
  { t:"Вложенные if",
    p:"В теле if могут находиться любые выражения, включая другие блоки if, if-else и if-elif-else. Вложенная цепочка уточняет решение внешнего условия.",
    code:'if num > 0:\n    adjective = ""\n    if num >= 1000000:\n        adjective = " очень большое"\n    elif num >= 1000:\n        adjective = " большое"\n    result = "Это" + adjective + " положительное число"' },
  { t:"Булева логика и операторы отношения",
    p:"Условия строятся операторами отношения (<, <=, >, >=, ==, !=) и комбинируются булевыми операторами: and (истинно, когда истинны оба), or (хотя бы одно), not (обращение значения).",
    code:'x = int(input("Введите целое число:"))\nif x == 2 or x == 3 or x == 5 or x == 7 or x == 11:\n    print("Это одно из первых пяти простых чисел.")\nelse:\n    print("Это не одно из первых пяти простых чисел.")' }
];

/* Задачи главы 2 (упражнения 35–62): условия дословно из сборника,
   включая таблицы, формулы, алгоритмы, подсказки и примечания книги */
var TASKS = [
  { id:35, title:"Чет или нечет?", diff:"easy",
    text:"Напишите программу, запрашивающую у пользователя целое число и выводящую на экран информацию о том, является введенное число четным или нечетным.",
    hint:"Признак нечетности — остаток от деления на 2: num % 2 == 1.",
    solution:'# Чет или нечет\nnum = int(input("Введите целое число: "))\n# Используем оператор взятия остатка от деления\nif num % 2 == 1:\n    print(num, "нечетное.")\nelse:\n    print(num, "четное.")' },
  { id:36, title:"Собачий возраст", diff:"mid",
    text:"Считается, что один год, прожитый собакой, эквивалентен семи человеческим годам. При этом зачастую не учитывается, что собаки становятся абсолютно взрослыми уже к двум годам. Таким образом, многие предпочитают каждый из первых двух лет жизни собаки приравнивать к 10,5 года человеческой жизни, а все последующие — к четырем.\n\nНапишите программу, которая будет переводить человеческий возраст в собачий с учетом указанной выше логики. Убедитесь, что программа корректно работает при пересчете возраста собаки меньше и больше двух лет. Также программа должна выводить сообщение об ошибке, если пользователь ввел отрицательное число.",
    hint:"Две ветки: до 2 лет включительно умножаем на 10.5; дальше 21 + 4 за каждый год сверх двух. Отдельно проверка на отрицательный ввод.",
    solution:'# Перевод человеческого возраста в собачий\nhuman = int(input("Введите возраст в человеческих годах: "))\nif human < 0:\n    print("Ошибка: возраст не может быть отрицательным.")\nelse:\n    if human <= 2:\n        dog = human * 10.5\n    else:\n        dog = 2 * 10.5 + (human - 2) * 4\n    print("В собачьих годах это: %.1f" % dog)' },
  { id:37, title:"Гласные и согласные", diff:"mid",
    text:"Разработайте программу, запрашивающую у пользователя букву латинского алфавита. Если введенная буква входит в следующий список (a, e, i, o или u), необходимо вывести сообщение о том, что эта буква гласная. Если была введена буква y, программа должна написать, что эта буква может быть как гласной, так и согласной. Во всех других случаях должно выводиться сообщение о том, что введена согласная буква.",
    hint:"Цепочка if-elif-else: пять гласных через or, затем особый случай y, иначе согласная.",
    solution:'# Гласная или согласная\nletter = input("Введите букву латинского алфавита:")\nif letter == "a" or letter == "e" or letter == "i" or letter == "o" or letter == "u":\n    print("Это гласная буква.")\nelif letter == "y":\n    print("Иногда гласная, иногда согласная.")\nelse:\n    print("Это согласная буква.")' },
  { id:38, title:"Угадайте фигуру", diff:"hard",
    text:"Напишите программу, определяющую вид фигуры по количеству ее сторон. Запросите у пользователя количество сторон и выведите сообщение с указанием вида фигуры. Программа должна корректно обрабатывать и выводить названия для фигур с количеством сторон от трех до десяти включительно. Если введенное пользователем значение находится за границами этого диапазона, уведомите его об этом.",
    hint:"Цепочка elif для значений 3–10; при неверном вводе имя фигуры остаётся пустым — по нему и печатаем уведомление.",
    solution:'# Вид фигуры по количеству сторон\nnsides = int(input("Введите количество сторон фигуры:"))\nname = ""\nif nsides == 3:\n    name = "треугольник"\nelif nsides == 4:\n    name = "прямоугольник"\nelif nsides == 5:\n    name = "пятиугольник"\nelif nsides == 6:\n    name = "шестиугольник"\nelif nsides == 7:\n    name = "семиугольник"\nelif nsides == 8:\n    name = "восьмиугольник"\nelif nsides == 9:\n    name = "девятиугольник"\nelif nsides == 10:\n    name = "десятиугольник"\nif name == "":\n    print("Введенное количество сторон не поддерживается программой.")\nelse:\n    print("Эта фигура:", name)' },
  { id:39, title:"Сколько дней в месяце?", diff:"mid",
    text:"Количество дней в месяце варьируется от 28 до 31. Очередная ваша программа должна запрашивать у пользователя название месяца и отображать количество дней в нем. Поскольку годы мы не учитываем, для февраля можно вывести сообщение о том, что этот месяц может состоять как из 28, так и из 29 дней, чтобы учесть фактор високосного года.",
    hint:"Начните с 31 дня и корректируйте: 30 у апреля, июня, сентября и ноября; для февраля присвойте строковое значение «28 или 29».",
    solution:'# Количество дней в месяце\nmonth = input("Введите название месяца:")\ndays = 31\nif month == "Апрель" or month == "Июнь" or month == "Сентябрь" or month == "Ноябрь":\n    days = 30\nelif month == "Февраль":\n    days = "28 или 29"\nprint("Количество дней в месяце", month, "равно", days)' },
  { id:40, title:"Громкость звука", diff:"mid",
    text:"В таблице представлен уровень громкости в децибелах для некоторых распространенных источников шума.",
    table:{ head:["Источник звука","Уровень громкости (дБ)"], rows:[
      ["Отбойный молоток","130"],
      ["Газовая газонокосилка","106"],
      ["Будильник","70"],
      ["Тихая комната","40"]]},
    text2:"Создайте программу, в которой пользователь будет вводить уровень шума в децибелах. Если введенное им значение будет в точности совпадать с одним из значений в приведенной таблице, необходимо вывести, чему соответствует указанный уровень громкости. Если значение попадет между уровнями в таблице, нужно сообщить, между какими именно. Также программа должна выдавать корректные сообщения, в случае если введенное пользователем значение окажется ниже минимального или больше максимального.",
    hint:"Идите сверху вниз: сначала «громче 130», затем точные совпадения и ветки «между» через elif; в конце — «тише тихой комнаты».",
    solution:'# Уровень громкости и его соседи\nnoise = int(input("Введите уровень шума (дБ): "))\nif noise > 130:\n    print("Громче, чем отбойный молоток.")\nelif noise == 130:\n    print("Отбойный молоток.")\nelif noise > 106:\n    print("Между газонокосилкой и отбойным молотком.")\nelif noise == 106:\n    print("Газовая газонокосилка.")\nelif noise > 70:\n    print("Между будильником и газонокосилкой.")\nelif noise == 70:\n    print("Будильник.")\nelif noise > 40:\n    print("Между тихой комнатой и будильником.")\nelif noise == 40:\n    print("Тихая комната.")\nelse:\n    print("Тише, чем в тихой комнате.")' },
  { id:41, title:"Классификация треугольников", diff:"mid",
    text:"Все треугольники могут быть отнесены к тому или иному классу (равнобедренные, равносторонние и разносторонние) на основании длин их сторон. Равносторонний треугольник характеризуется одинаковой длиной всех трех сторон, равнобедренный — двух сторон из трех, а у разностороннего треугольника все стороны разной длины.\n\nНапишите программу, которая будет запрашивать у пользователя длины всех трех сторон треугольника и выдавать сообщение о том, к какому типу следует его относить.",
    hint:"Сначала проверьте равенство всех трех сторон, затем — хотя бы двух (через or), иначе треугольник разносторонний.",
    solution:'# Классификация треугольников\nside1 = float(input("Введите длину первой стороны:"))\nside2 = float(input("Введите длину второй стороны:"))\nside3 = float(input("Введите длину третьей стороны:"))\nif side1 == side2 and side2 == side3:\n    tri_type = "равносторонний"\nelif side1 == side2 or side2 == side3 or side3 == side1:\n    tri_type = "равнобедренный"\nelse:\n    tri_type = "разносторонний"\nprint("Это", tri_type, "треугольник")' },
  { id:42, title:"Узнать частоту по ноте", diff:"hard",
    text:"В таблице перечислены частоты звуков, относящихся к одной октаве, начиная с до.",
    table:{ head:["Нота","Частота (Гц)"], rows:[
      ["C4","261.63"],["D4","293.66"],["E4","329.63"],["F4","349.23"],["G4","392.00"],["A4","440.00"],["B4","493.88"]]},
    text2:"Пусть ваша программа запрашивает у пользователя обозначение ноты и показывает ее частоту согласно приведенной таблице. После этого доработайте программу таким образом, чтобы она поддерживала все октавы, начиная от субконтроктавы (C0) до пятой октавы (C8). Добавлять бесконечное количество блоков if недопустимо: вместо этого при расчетах лучше использовать отношения между одними и теми же нотами в соседствующих октавах. К примеру, частота любой ноты октавы n будет составлять ровно половину от частоты той же ноты октавы n + 1.",
    bookHint:"Пользователь должен вводить ноту вместе с номером нотации октавы. Начните с разделения буквы, обозначающей ноту, и цифры, соответствующей номеру октавы. Затем определите частоту введенной ноты по представленной выше таблице и разделите ее на 2 в степени (4 − x), где x — номер октавы в научной нотации, введенный пользователем. Это позволит умножить или разделить на два число из таблицы нужное количество раз.",
    hint:"note = name[0], octave = int(name[1]); частоту из таблицы делите на 2 ** (4 - octave).",
    solution:'# Частота ноты\nC4_FREQ = 261.63\nD4_FREQ = 293.66\nE4_FREQ = 329.63\nF4_FREQ = 349.23\nG4_FREQ = 392.00\nA4_FREQ = 440.00\nB4_FREQ = 493.88\nname = input("Введите название ноты в виде буквы и цифры, например C4:")\nnote = name[0]\noctave = int(name[1])\nif note == "C":\n    freq = C4_FREQ\nelif note == "D":\n    freq = D4_FREQ\nelif note == "E":\n    freq = E4_FREQ\nelif note == "F":\n    freq = F4_FREQ\nelif note == "G":\n    freq = G4_FREQ\nelif note == "A":\n    freq = A4_FREQ\nelif note == "B":\n    freq = B4_FREQ\nfreq = freq / 2 ** (4 - octave)\nprint("Частота ноты", name, "равна", freq)' },
  { id:43, title:"Узнать ноту по частоте", diff:"hard",
    text:"В предыдущем упражнении мы определяли частоту ноты по ее названию и номеру октавы. Теперь выполним обратную операцию. Запросите у пользователя частоту звука. Если введенное значение укладывается в диапазон ±1 Гц от значения в таблице (C4 — 261.63, D4 — 293.66, E4 — 329.63, F4 — 349.23, G4 — 392.00, A4 — 440.00, B4 — 493.88), выведите на экран название соответствующей ноты. В противном случае сообщите пользователю, что ноты, соответствующей введенной частоте, не существует. В данном упражнении можно ограничиться только нотами, приведенными в таблице. Нет необходимости брать в расчет другие октавы.",
    hint:"Для каждой частоты таблицы проверяйте окно через двойное неравенство (freq >= F - 1 and freq <= F + 1); пустая строка-маркер означает «не найдено».",
    solution:'# Нота по частоте\nC4_FREQ = 261.63\nD4_FREQ = 293.66\nE4_FREQ = 329.63\nF4_FREQ = 349.23\nG4_FREQ = 392.00\nA4_FREQ = 440.00\nB4_FREQ = 493.88\nLIMIT = 1\nfreq = float(input("Введите частоту ноты (Гц):"))\nif freq >= C4_FREQ - LIMIT and freq <= C4_FREQ + LIMIT:\n    note = "C4"\nelif freq >= D4_FREQ - LIMIT and freq <= D4_FREQ + LIMIT:\n    note = "D4"\nelif freq >= E4_FREQ - LIMIT and freq <= E4_FREQ + LIMIT:\n    note = "E4"\nelif freq >= F4_FREQ - LIMIT and freq <= F4_FREQ + LIMIT:\n    note = "F4"\nelif freq >= G4_FREQ - LIMIT and freq <= G4_FREQ + LIMIT:\n    note = "G4"\nelif freq >= A4_FREQ - LIMIT and freq <= A4_FREQ + LIMIT:\n    note = "A4"\nelif freq >= B4_FREQ - LIMIT and freq <= B4_FREQ + LIMIT:\n    note = "B4"\nelse:\n    note = ""\nif note == "":\n    print("Ноты с заданной частотой не существует.")\nelse:\n    print("Введенная частота примерно соответствует ноте", note)' },
  { id:44, title:"Портреты на банкнотах", diff:"hard",
    text:"Во многих странах существует традиция помещать портреты своих бывших политических лидеров или других выдающихся личностей на банкноты. В таблице приведены номиналы банкнот США с изображенными на них людьми.",
    table:{ head:["Портрет","Номинал банкноты"], rows:[
      ["Джордж Вашингтон","$1"],["Томас Джефферсон","$2"],["Авраам Линкольн","$5"],["Александр Гамильтон","$10"],["Эндрю Джексон","$20"],["Улисс Грант","$50"],["Бенджамин Франклин","$100"]]},
    text2:"Напишите программу, которая будет запрашивать у пользователя номинал банкноты и отображать на экране имя деятеля, портрет которого размещен на соответствующем денежном знаке. Если банкноты введенного номинала не существует, должно выводиться сообщение об ошибке.",
    note:"Хотя банкноты номиналом два доллара очень редко можно встретить в США, официально они существуют и могут быть использованы при любых расчетах. Также в начале прошлого века в Америке были выпущены в обращение банкноты номиналом $500, $1000, $5000 и $10 000, хотя с 1945 года они не печатались, а в 1969 году и вовсе были выведены из обращения. Так что их мы не будем рассматривать в данном упражнении.",
    hint:"Цепочка elif по номиналам от 1 до 100; в else выводим сообщение об ошибке.",
    solution:'# Портрет на банкноте\nbill = int(input("Введите номинал банкноты: "))\nif bill == 1:\n    who = "Джордж Вашингтон"\nelif bill == 2:\n    who = "Томас Джефферсон"\nelif bill == 5:\n    who = "Авраам Линкольн"\nelif bill == 10:\n    who = "Александр Гамильтон"\nelif bill == 20:\n    who = "Эндрю Джексон"\nelif bill == 50:\n    who = "Улисс Грант"\nelif bill == 100:\n    who = "Бенджамин Франклин"\nelse:\n    who = ""\nif who == "":\n    print("Банкноты введенного номинала не существует.")\nelse:\n    print("Портрет на банкноте:", who)' },
  { id:45, title:"Даты праздников", diff:"mid",
    text:"В Канаде есть три национальных праздника, отмечающихся в одни и те же даты каждый год. Они приведены в таблице.",

    text2:"Напишите программу, которая будет запрашивать у пользователя день и месяц. Если введенные данные в точности указывают на один из перечисленных в таблице праздников, необходимо вывести его название. В противном случае сообщить, что на заданную дату праздники не приходятся.",
    note:"В Канаде есть два дополнительных национальных праздника: Страстная пятница и Праздник трудящихся, — которые выпадают на разные даты каждый год. Есть свои праздники и в отдельных провинциях — некоторые с фиксированными датами, другие — с плавающими. Мы не будем рассматривать такие праздники в этом упражнении.",
    hint:"Каждый праздник — пара условий «месяц и день», соединённых через and; иначе — сообщение об отсутствии праздника.",
    solution:'# Даты праздников\nday = int(input("Введите день: "))\nmonth = input("Введите месяц: ")\nif month == "Январь" and day == 1:\n    holiday = "Новый год"\nelif month == "Июль" and day == 1:\n    holiday = "День Канады"\nelif month == "Декабрь" and day == 25:\n    holiday = "Рождество"\nelse:\n    holiday = ""\nif holiday == "":\n    print("На заданную дату праздники не приходятся.")\nelse:\n    print("Праздник на эту дату:", holiday)' },
  { id:46, title:"Какого цвета клетка?", diff:"mid",
    text:"Клетки на шахматной доске идентифицируются буквой и цифрой. Буква определяет положение клетки по горизонтали, а цифра — по вертикали.\n\nВаша программа должна запрашивать у пользователя координаты клетки. Используйте условное выражение для определения того, с какой клетки — белой или черной — начинается столбец. Затем при помощи обычной арифметики необходимо определить цвет конкретной клетки. Например, если пользователь ввел a1, программа должна определить, что клетка с этими координатами черная. Если d5 — белая. Проверку на ошибочность ввода координат клетки выполнять не нужно.",
    example:"Введите координаты клетки: a1\nКлетка a1 черная.",
    hint:"Переведите букву в номер столбца: ord(letter) - ord('a') + 1. Сумма с номером строки четная — клетка черная (проверьте на a1), нечетная — белая.",
    solution:'# Цвет шахматной клетки\ncell = input("Введите координаты клетки: ")\nletter = cell[0]\ndigit = int(cell[1])\ncol = ord(letter) - ord("a") + 1\nif (col + digit) % 2 == 0:\n    color = "черная"\nelse:\n    color = "белая"\nprint("Клетка", cell, color)' },
  { id:47, title:"Определение времени года", diff:"hard",
    text:"Год делится на четыре сезона: зима, весна, лето и осень. Хотя даты смены сезонов каждый год могут меняться из-за особенностей календаря, мы в данном упражнении примем допущения, перечисленные в таблице.",
    table:{ head:["Сезон","Первый день"], rows:[
      ["Весна","20 марта"],["Лето","21 июня"],["Осень","22 сентября"],["Зима","21 декабря"]]},
    text2:"Разработайте программу, запрашивающую у пользователя день и месяц — сначала месяц в текстовом варианте, затем номер дня. На выходе программа должна выдать название сезона, которому принадлежит выбранная дата.",
    hint:"Пограничные месяцы (март, июнь, сентябрь, декабрь) требуют вложенного if по дню внутри elif; остальные месяцы определяются без проверки дня.",
    solution:'# Сезон по дате\nmonth = input("Введите название месяца:")\nday = int(input("Введите день:"))\nif month == "Январь" or month == "Февраль":\n    season = "Зима"\nelif month == "Март":\n    if day < 20:\n        season = "Зима"\n    else:\n        season = "Весна"\nelif month == "Апрель" or month == "Май":\n    season = "Весна"\nelif month == "Июнь":\n    if day < 21:\n        season = "Весна"\n    else:\n        season = "Лето"\nelif month == "Июль" or month == "Август":\n    season = "Лето"\nelif month == "Сентябрь":\n    if day < 22:\n        season = "Лето"\n    else:\n        season = "Осень"\nelif month == "Октябрь" or month == "Ноябрь":\n    season = "Осень"\nelif month == "Декабрь":\n    if day < 21:\n        season = "Осень"\n    else:\n        season = "Зима"\nprint(month, day, "соответствует сезону", season)' },
  { id:48, title:"Знаки зодиака", diff:"hard",
    text:"В гороскопах, наполняющих газеты и журналы, астрологи пытаются положение солнца в момент рождения человека как-то связать с его судьбой. Всего насчитывается 12 знаков зодиака, и все они приведены в таблице.",
    table:{ head:["Знак зодиака","Даты","Знак зодиака","Даты"], rows:[
      ["Козерог","22 декабря – 19 января","Рак","21 июня – 22 июля"],
      ["Водолей","20 января – 18 февраля","Лев","23 июля – 22 августа"],
      ["Рыбы","19 февраля – 20 марта","Дева","23 августа – 22 сентября"],
      ["Овен","21 марта – 19 апреля","Весы","23 сентября – 22 октября"],
      ["Телец","20 апреля – 20 мая","Скорпион","23 октября – 21 ноября"],
      ["Близнецы","21 мая – 20 июня","Стрелец","22 ноября – 21 декабря"]]},
    text2:"Напишите программу, запрашивающую у пользователя дату его рождения и выводящую на экран соответствующий знак зодиака.",
    hint:"Каждый знак занимает конец одного месяца и начало следующего: соединяйте два условия через or и выстройте цепочку elif; последний знак оставьте в else.",
    solution:'# Знак зодиака\nmonth = int(input("Введите месяц рождения (1-12): "))\nday = int(input("Введите день рождения: "))\nif (month == 12 and day >= 22) or (month == 1 and day <= 19):\n    sign = "Козерог"\nelif (month == 1 and day >= 20) or (month == 2 and day <= 18):\n    sign = "Водолей"\nelif (month == 2 and day >= 19) or (month == 3 and day <= 20):\n    sign = "Рыбы"\nelif (month == 3 and day >= 21) or (month == 4 and day <= 19):\n    sign = "Овен"\nelif (month == 4 and day >= 20) or (month == 5 and day <= 20):\n    sign = "Телец"\nelif (month == 5 and day >= 21) or (month == 6 and day <= 20):\n    sign = "Близнецы"\nelif (month == 6 and day >= 21) or (month == 7 and day <= 22):\n    sign = "Рак"\nelif (month == 7 and day >= 23) or (month == 8 and day <= 22):\n    sign = "Лев"\nelif (month == 8 and day >= 23) or (month == 9 and day <= 22):\n    sign = "Дева"\nelif (month == 9 and day >= 23) or (month == 10 and day <= 22):\n    sign = "Весы"\nelif (month == 10 and day >= 23) or (month == 11 and day <= 21):\n    sign = "Скорпион"\nelse:\n    sign = "Стрелец"\nprint("Ваш знак зодиака:", sign)' },
  { id:49, title:"Китайский гороскоп", diff:"hard",

  { id:51, title:"Корни квадратичной функции", diff:"mid",
    text:"Общий вид квадратичной функции одной переменной имеет следующий вид: f(x) = ax² + bx + c, где a, b и c — константы и a не равна нулю. Корни этой функции могут быть извлечены путем нахождения таких значений переменной x, для которых будет соблюдаться равенство ax² + bx + c = 0. Эти значения могут быть вычислены с помощью формулы для корней квадратного уравнения, показанной ниже. Квадратичная функция может иметь от нуля до двух действительных корней.",
    formula:"x = (−b ± √(b² − 4ac)) / (2a)",
    text2:"Часть выражения под квадратным корнем называется дискриминантом. Если дискриминант отрицательный, квадратное уравнение не будет иметь действительных корней. В случае равенства дискриминанта нулю у квадратного уравнения будет ровно один действительный корень. Иначе корней будет два, и выражение необходимо будет вычислить дважды: один раз со знаком плюс, второй со знаком минус для числителя.\n\nНапишите программу, вычисляющую действительные корни квадратичной функции. Сначала вы должны запросить у пользователя значения a, b и c. После этого должно быть выведено на экран количество действительных корней функции и их значения.",
    hint:"d = b ** 2 - 4 * a * c; при d < 0 корней нет, при d == 0 один корень −b/(2a), иначе два корня через sqrt(d).",
    solution:'# Корни квадратичной функции\nfrom math import sqrt\na = float(input("Введите a: "))\nb = float(input("Введите b: "))\nc = float(input("Введите c: "))\nd = b ** 2 - 4 * a * c\nif d < 0:\n    print("Действительных корней нет: 0")\nelif d == 0:\n    print("Один действительный корень:")\n    print("x =", -b / (2 * a))\nelse:\n    print("Два действительных корня:")\n    print("x1 =", (-b + sqrt(d)) / (2 * a))\n    print("x2 =", (-b - sqrt(d)) / (2 * a))' },
  { id:52, title:"Буквенные оценки – в числовые", diff:"hard",

    solution:'# Буквенная оценка в числовую\nA = 4.0\nA_MINUS = 3.7\nB_PLUS = 3.3\nB = 3.0\nB_MINUS = 2.7\nC_PLUS = 2.3\nC = 2.0\nC_MINUS = 1.7\nD_PLUS = 1.3\nD = 1.0\nF = 0\nINVALID = -1\nletter = input("Введите буквенную оценку:")\nletter = letter.upper()\nif letter == "A+" or letter == "A":\n    gp = A\nelif letter == "A-":\n    gp = A_MINUS\nelif letter == "B+":\n    gp = B_PLUS\nelif letter == "B":\n    gp = B\nelif letter == "B-":\n    gp = B_MINUS\nelif letter == "C+":\n    gp = C_PLUS\nelif letter == "C":\n    gp = C\nelif letter == "C-":\n    gp = C_MINUS\nelif letter == "D+":\n    gp = D_PLUS\nelif letter == "D":\n    gp = D\nelif letter == "F":\n    gp = F\nelse:\n    gp = INVALID\nif gp == INVALID:\n    print("Введена некорректная оценка.")\nelse:\n    print("Буквенная оценка", letter, "соответствует", gp, "баллам.")' },

    text:"Представьте, что в компании проводится аттестация сотрудников в конце каждого года. Шкала рейтинга начинается на отметке 0,0, и чем лучше оценка, тем выше руководство оценивает сотрудника, а значит, тем больше будет его прибавка к зарплате. Рейтинг, присваиваемый сотрудникам, может составлять значения 0,0, 0,4 или 0,6 и выше. Значения между 0,0 и 0,4, а также между 0,4 и 0,6 никогда не используются. Значения, ассоциированные с каждым рейтингом, показаны в таблице. Прибавка к зарплате сотрудника рассчитывается как рейтинг, умноженный на $2400,00.",

  { id:57, title:"Счет за телефон", diff:"hard",
    text:"Тарифный план мобильной связи включает в себя 50 минут разговоров и 50 смс-сообщений за $15,00 в месяц. Каждая дополнительная минута стоит $0,25, а каждое дополнительное сообщение — $0,15. Все счета за телефон включают налог на поддержку кол-центров 911 в размере $0,44, и общая сумма, включающая сумму отчислений кол-центрам, облагается налогом в размере 5 %.\n\nНапишите программу, которая будет запрашивать у пользователя количество израсходованных за месяц минут разговора и смс-сообщений и отображать базовую сумму тарификации, сумму за дополнительные минуты и сообщения, сумму отчислений кол-центрам 911, налог, а также итоговую сумму к оплате. При этом дополнительные звонки и сообщения необходимо выводить на экран только в случае их расходования. Убедитесь в том, что все суммы отображаются в формате с двумя знаками после запятой.",

    solution:'# Счет за телефон\nBASE_PRICE = 15.00\nPER_MINUTE = 0.25\nPER_SMS = 0.15\nSUPPORT_911 = 0.44\nTAX_RATE = 0.05\nminutes = int(input("Минут разговора за месяц: "))\nsms = int(input("Смс-сообщений за месяц: "))\nextra_min = 0.00\nextra_sms = 0.00\nif minutes > 50:\n    extra_min = (minutes - 50) * PER_MINUTE\nif sms > 50:\n    extra_sms = (sms - 50) * PER_SMS\nsubtotal = BASE_PRICE + extra_min + extra_sms + SUPPORT_911\ntax = subtotal * TAX_RATE\ntotal = subtotal + tax\nprint("Базовая сумма: %.2f" % BASE_PRICE)\nif extra_min > 0:\n    print("Дополнительные минуты: %.2f" % extra_min)\nif extra_sms > 0:\n    print("Дополнительные сообщения: %.2f" % extra_sms)\nprint("Поддержка 911: %.2f" % SUPPORT_911)\nprint("Налог: %.2f" % tax)\nprint("Итоговая сумма к оплате: %.2f" % total)' },

function loadSaved(){
  try{
    var raw = localStorage.getItem(LS_STATE);
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s.student) state.student = s.student;
    if(s.codes) state.codes = Object.assign(state.codes, s.codes);
    if(s.hintUsed) state.hintUsed = Object.assign(state.hintUsed, s.hintUsed);
    if(s.etalonViewed) state.etalonViewed = Object.assign(state.etalonViewed, s.etalonViewed);
    if(s.etalonNoAttempt) state.etalonNoAttempt = Object.assign(state.etalonNoAttempt, s.etalonNoAttempt);
    if(s.solved) state.solved = Object.assign(state.solved, s.solved);
    if(s.reportOpen) state.reportOpen = true;
  }catch(e){}
}
function persist(){
  try{
    localStorage.setItem(LS_STATE, JSON.stringify({
      student:state.student, codes:state.codes,
      hintUsed:state.hintUsed, etalonViewed:state.etalonViewed,
      etalonNoAttempt:state.etalonNoAttempt, solved:state.solved,
      reportOpen:state.reportOpen
    }));
  }catch(e){}
}
function setProgress(status){
  try{
    var raw = localStorage.getItem(LS_PROGRESS);
    var p = raw ? JSON.parse(raw) : {topic:{}, task:{}};

    localStorage.setItem(LS_PROGRESS, JSON.stringify(p));

}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
  });
}
function hlPy(src){
  return esc(src).replace(
    /(#.*$)|(&quot;(?:[^&\\]|\\.)*?&quot;|&#39;(?:[^&\\]|\\.)*?&#39;)|\b(from|import|def|return|if|elif|else|for|while|in|and|or|not|True|False|pass|break|continue|try|except|with|as|lambda|global|None)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()/gm,
    function(m, com, str, kw, num, fn){
      if(com) return '<span class="tk-c">' + com + '</span>';
      if(str) return '<span class="tk-s">' + str + '</span>';
      if(kw)  return '<span class="tk-k">' + kw + '</span>';
      if(num) return '<span class="tk-n">' + num + '</span>';
      if(fn)  return '<span class="tk-f">' + fn + '</span>';
      return m;
    });
}
function codeWindow(src, file){
  return '<div class="code-window"><div class="code-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="file">' + (file || "program.py") + '</span></div><pre class="code">' + hlPy(src) + '</pre></div>';
}
/* счётчики */
function solvedCount(){ return TASKS.filter(function(t){ return state.solved[t.id]; }).length; }
function codeCount(){ return TASKS.filter(function(t){ return (state.codes[t.id] || "").trim(); }).length; }
function hintCount(){ return TASKS.filter(function(t){ return state.hintUsed[t.id]; }).length; }
function etalonCount(){ return TASKS.filter(function(t){ return state.etalonViewed[t.id]; }).length; }
function touched(t){
  return (state.codes[t.id] || "").trim() || state.hintUsed[t.id] || state.etalonViewed[t.id] || state.solved[t.id];
}
function doneThreshold(){ return Math.ceil(TASKS.length * DONE_SHARE); }

}

function taskCard(t){

    (solved ? '<span class="tag solved">решено</span>' : '');

      parasHTML(t.text) +
      (t.bullets ? '<ul class="task-list">' + t.bullets.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join("") + '</ul>' : '') +
      (t.table ? tableHTML(t.table) : '') +
      (t.formula ? formulaHTML(t.formula) : '') +
      (t.text2 ? parasHTML(t.text2) : '') +
      (t.steps ? '<ol class="task-steps">' + t.steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join("") + '</ol>' : '') +
      (t.after ? parasHTML(t.after) : '') +

      (state.etalonShown[t.id] && state.etalonViewed[t.id] ? '<div class="etalon"><p class="label-sm">Эталон решения</p>' + codeWindow(t.solution, "task" + t.id + ".py") + '</div>' : '') +

function renderTasks(){
  var q = state.query.trim().toLowerCase();
  var list = TASKS.filter(function(t){
    if(state.filter === "todo" && state.solved[t.id]) return false;
    if(state.filter === "done" && !state.solved[t.id]) return false;
    if(q && String(t.id) !== q && t.title.toLowerCase().indexOf(q) === -1) return false;

  });
  var solved = solvedCount();

  var toolbar =

function renderSummary(){

  var warns = [];
  if(code === 0) warns.push("Пока нет кода ни к одной задаче.");
  if(solved < th) warns.push("До зачёта главы не хватает решённых задач: нужно " + th + " из " + TASKS.length + " (сейчас " + solved + ").");
  return '<div class="container">' +
    '<p class="section-note">Сводка работы за главу. Глава считается пройденной, когда отмечено решёнными не менее ' + Math.round(DONE_SHARE * 100) + '% задач (' + th + ' из ' + TASKS.length + ') и нажата кнопка завершения.</p>' +
    '<div class="sum-card">' +
      sumRow("💻", "Код написан", code + " из " + TASKS.length + " задач", Math.round(code / TASKS.length * 100), "Поле «Мой код» непустое.") +
      sumRow("✅", "Отмечено решёнными", solved + " из " + TASKS.length, Math.round(solved / TASKS.length * 100), "Порог зачёта главы: " + th + " задач.") +
      sumRow("💡", "Подсказки", "использовано " + hints, Math.round(hints / TASKS.length * 100), "Подсказка фиксируется в отчёте.") +
      sumRow("📖", "Эталоны", "просмотрено " + etal, Math.round(etal / TASKS.length * 100), "Просмотр без своей попытки помечается отдельно.") +
    '</div>' +
    (warns.length
      ? '<div class="call warn" style="margin-top:16px"><span class="call-ic" aria-hidden="true">⚠️</span><div><p><b>Обратите внимание:</b></p><ul style="margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;">' + warns.map(function(w){ return "<li>" + w + "</li>"; }).join("") + '</ul></div></div>'
      : '<div class="call ok" style="margin-top:16px"><span class="call-ic" aria-hidden="true">🎉</span><div><p>Порог главы достигнут — можно завершать урок и сохранять отчёт!</p></div></div>') +
    '<div class="sum-actions"><button class="btn btn-primary" type="button" data-act="finish">Завершить урок и открыть отчёт</button></div>' +
    '<p class="hint-print" style="margin:10px 0 40px">В отчёт попадут только задачи, с которыми вы работали: ваш код и отметки о подсказках и эталонах.</p>' +
  '</div>';
}
function renderReport(){
  var st = state.student;
  var date = new Date().toLocaleDateString("ru-RU");
  var solved = solvedCount();
  var passed = solved >= doneThreshold();
  var touchedList = TASKS.filter(touched);
  var tasks = touchedList.length
    ? touchedList.map(function(t){
        return '<h3>Задача ' + t.id + '. ' + esc(t.title) + '</h3>' +
          '<p class="rep-note">Решена: <b>' + (state.solved[t.id] ? "да" : "нет") + '</b> · Подсказка: <b>' + (state.hintUsed[t.id] ? "да" : "нет") + '</b> · Эталон: <b>' + (state.etalonViewed[t.id] ? (state.etalonNoAttempt[t.id] ? "да, без своей попытки" : "да") : "нет") + '</b></p>' +
          '<p class="label-sm">Мой код</p><pre>' + ((state.codes[t.id] || "").trim() ? esc(state.codes[t.id]) : "— код не предоставлен —") + '</pre>';
      }).join("")
    : '<p class="rep-note">Работ с задачами не зафиксировано.</p>';
  return '<div class="container"><div class="report" id="reportSheet">' +
    '<h2>Отчёт по практике</h2>' +
    '<div class="meta">' +
      '<span><b>Глава:</b> ' + META.num + '. ' + META.topic + ' (сборник Б. Стивенсона)</span>' +
      '<span><b>Автор курса:</b> ' + META.author + '</span>' +
      '<span><b>Ученик:</b> ' + esc(st.last) + ' ' + esc(st.first) + '</span>' +
      '<span><b>Класс:</b> ' + esc(st.cls) + '</span>' +
      '<span><b>Дата:</b> ' + date + '</span>' +
      '<span><b>Решено задач:</b> ' + solved + ' из ' + TASKS.length + ' · глава зачтена: ' + (passed ? "да" : "нет") + '</span>' +
      '<span><b>Подсказок:</b> ' + hintCount() + ' · <b>эталонов:</b> ' + etalonCount() + ' · задач с кодом: ' + codeCount() + '</span>' +
    '</div>' +
    '<h3>Выполненные работы</h3>' + tasks +
    '</div>' +
    '<div class="report-actions no-print"><button class="btn btn-primary" type="button" data-act="print">Сохранить отчёт в PDF</button></div>' +
    '<p class="hint-print no-print">Откроется окно печати — выберите «Сохранить как PDF». В отчёт входят только задачи, с которыми была работа.</p>' +
    '</div>';
}
function renderLesson(){
  var st = state.student;
  var tabs = [
    ["ref", "Справка"],
    ["tasks", "Задачи"],
    ["report", state.reportOpen ? "Отчёт" : "Итоги"]
  ];
  var body = state.tab === "ref" ? renderRef()
    : state.tab === "tasks" ? renderTasks()
    : (state.reportOpen ? renderReport() : renderSummary());
  return '<div class="container no-print"><div class="lesson-head">' +
    '<h1>Глава ' + META.num + '. ' + META.topic + '</h1>' +
    '<button class="chip-student" type="button" data-act="edit-student" title="Изменить данные ученика">' + esc(st.last) + ' ' + esc(st.first) + ' · ' + esc(st.cls) + ' ✎</button>' +
    '</div>' +
    '<div class="tabs" role="tablist" aria-label="Разделы практики">' +
    tabs.map(function(t){
      return '<button class="tab" role="tab" type="button" aria-selected="' + (state.tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join("") +
    '</div></div>' + body;
}
function render(){
  app.innerHTML = state.screen === "start" ? renderStart() : renderLesson();
}

/* ================= HANDLERS ================= */
var toastEl = null, toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
}
function onStartSubmit(e){
  e.preventDefault();
  var f = e.target;
  var last = f.last.value.trim(), first = f.first.value.trim(), cls = f.cls.value.trim();
  var errs = {};
  if(last.length < 2) errs.last = "Введите фамилию (минимум 2 символа).";
  if(first.length < 2) errs.first = "Введите имя (минимум 2 символа).";
  if(!cls) errs.cls = "Введите класс, например 9А.";
  state.student = {last:last, first:first, cls:cls};
  if(Object.keys(errs).length){
    state.startErrors = errs;
    render();
    var bad = app.querySelector("input.bad");
    if(bad) bad.focus();
    return;
  }
  state.startErrors = null;
  state.screen = "lesson";
  state.tab = "ref";
  setProgress("progress");
  persist();
  render();
  showToast("Практика начата: " + TASKS.length + " задачи впереди!");
}
function onAppClick(e){
  var tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){
    state.tab = tabBtn.dataset.tab;
    render();
    window.scrollTo(0, 0);
    return;
  }
  var fBtn = e.target.closest("[data-filter]");
  if(fBtn){
    state.filter = fBtn.dataset.filter;
    render();
    return;
  }
  var btn = e.target.closest("[data-act]");
  if(!btn) return;
  var act = btn.dataset.act;
  var id = Number(btn.dataset.id || 0);
  if(act === "toggle-open"){
    state.open[id] = !state.open[id];
    render();
  }
  else if(act === "toggle-hint"){
    var nowH = !state.hintShown[id];
    state.hintShown[id] = nowH;
    if(nowH) state.hintUsed[id] = true;
    persist();
    render();
  }
  else if(act === "toggle-solved"){
    state.solved[id] = !state.solved[id];
    persist();
    render();
    showToast(state.solved[id] ? "Задача " + id + " отмечена решённой." : "Отметка снята с задачи " + id + ".");
  }
  else if(act === "etalon"){
    if(state.etalonViewed[id]){
      state.etalonShown[id] = !state.etalonShown[id];
    }else if((state.codes[id] || "").trim()){
      state.etalonViewed[id] = true;
      state.etalonShown[id] = true;
      persist();
    }else{
      state.etalonConfirm[id] = true;
    }
    render();
  }
  else if(act === "etalon-yes"){
    state.etalonViewed[id] = true;
    state.etalonNoAttempt[id] = true;
    state.etalonShown[id] = true;
    state.etalonConfirm[id] = false;
    persist();
    render();
  }
  else if(act === "etalon-no"){
    state.etalonConfirm[id] = false;
    render();
  }
  else if(act === "finish"){
    state.reportOpen = true;
    state.tab = "report";
    setProgress(solvedCount() >= doneThreshold() ? "done" : "progress");
    persist();
    render();
    window.scrollTo(0, 0);
    showToast("Урок завершён! Отчёт готов к сохранению в PDF.");
  }
  else if(act === "edit-student"){ state.screen = "start"; render(); window.scrollTo(0, 0); }
  else if(act === "print"){ window.print(); }
}
function onAppInput(e){
  var ta = e.target.closest("textarea[data-code]");
  if(ta){
    state.codes[Number(ta.dataset.code)] = ta.value;
    persist();
    return;
  }
  if(e.target.id === "taskSearch"){
    state.query = e.target.value;
    render();
    var el = document.getElementById("taskSearch");
    if(el){
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    }
  }
}

/* ================= INIT ================= */
function init(){
  loadSaved();
  toastEl = document.createElement("div");
  toastEl.className = "toast";
  toastEl.setAttribute("role", "status");
  toastEl.setAttribute("aria-live", "polite");
  document.body.appendChild(toastEl);
  render();
  app.addEventListener("click", onAppClick);
  app.addEventListener("input", onAppInput);
  app.addEventListener("submit", onStartSubmit);
}
try{
  init();
}catch(err){
  app.innerHTML = '<div class="fatal">Ошибка при запуске: ' + err.message + '</div>';
}
</script>
</body>
</html>
