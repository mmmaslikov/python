<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Практика · Глава 2 — Python‑тренажер</title>
<style>
:root{
  --bg:#f5f5f7;
  --surface:#ffffff;
  --text:#1d1d1f;
  --muted:#6e6e73;
  --accent:#0071e3;
  --accent-dark:#005bb9;
  --danger:#c22a1e;
  --ok:#1c7c3c;
  --radius:18px;
  --radius-sm:12px;
  --shadow:0 8px 24px rgba(0,0,0,.06);
  --shadow-lift:0 14px 34px rgba(0,0,0,.10);
  --border:rgba(0,0,0,.07);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  line-height:1.5;-webkit-font-smoothing:antialiased;
  overflow-x:clip;
}
.container{width:100%;max-width:960px;margin:0 auto;padding-left:20px;padding-right:20px;min-width:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-9999px;top:0;z-index:200;background:#fff;color:var(--accent);padding:12px 18px;border-radius:0 0 12px 0;font-weight:600;text-decoration:none}
.skip:focus{left:0}
b{font-weight:700}
.fatal{padding:40px 20px;font-family:var(--mono);font-size:14px;color:var(--danger);white-space:pre-wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border-radius:999px;border:none;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;transition:background .15s ease,transform .15s ease}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark)}
.btn-small{min-height:44px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--text)}
.btn-small:hover{background:#f5f5f7}

.start-card{max-width:560px;margin:44px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px}
.eyebrow{color:var(--accent);font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase}
.start-card h1{font-size:clamp(28px,5vw,40px);font-weight:800;letter-spacing:-.02em;margin:10px 0 6px}
.author{color:var(--muted);margin:0 0 18px;font-size:15px}
.start-list{margin:0 0 22px;padding-left:20px;color:var(--muted);font-size:14.5px;display:grid;gap:6px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label{font-size:14px;font-weight:600}
.field input{min-height:48px;border:1px solid var(--border);border-radius:12px;padding:0 14px;font-size:16px;background:#fff;color:var(--text);width:100%}
.field input:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.field input.bad{border-color:var(--danger);box-shadow:0 0 0 3px rgba(194,42,30,.12)}
.err{color:var(--danger);font-size:13px;margin:0}

.lesson-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:16px 0 10px}
.lesson-head h1{font-size:20px;margin:0;letter-spacing:-.01em;flex:1 1 auto;min-width:160px}
.chip-student{min-height:44px;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:0 16px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.chip-student:hover{background:#f5f5f7}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:15px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab:hover{background:#f5f5f7}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.section-note{color:var(--muted);font-size:14.5px;margin:14px 0 18px;max-width:760px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin:0 0 14px;min-width:0}
.card h3{margin:0 0 8px;font-size:17px}
.card p{margin:0 0 10px;font-size:14.5px;line-height:1.6}
.call{display:flex;gap:12px;align-items:flex-start;border-radius:14px;padding:14px 16px;margin:0 0 14px;border:1px solid}
.call p{margin:0;font-size:14.5px;line-height:1.6;min-width:0}
.call>div{min-width:0}
.call-ic{font-size:20px;line-height:1.4;flex:none}
.call.info{background:rgba(0,113,227,.07);border-color:rgba(0,113,227,.25)}
.call.warn{background:rgba(255,159,10,.1);border-color:rgba(255,159,10,.35)}
.call.ok{background:rgba(52,199,89,.1);border-color:rgba(52,199,89,.35)}
.code-window{background:#161617;border-radius:14px;overflow:hidden;margin:0 0 12px;box-shadow:var(--shadow);min-width:0}
.code-bar{display:flex;align-items:center;gap:7px;padding:10px 14px;background:#1d1d1f}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.code-bar .file{margin-left:6px;color:#98989d;font-family:var(--mono);font-size:12px}
pre.code{margin:0;padding:14px 16px;color:#f5f5f7;font-family:var(--mono);font-size:13px;line-height:1.65;overflow-x:auto;white-space:pre;max-width:100%}
.tk-c{color:#83838a}.tk-k{color:#ff7ab2}.tk-s{color:#ffa740}.tk-n{color:#d9bf69}.tk-f{color:#6bdfff}
.screen{background:rgba(52,199,89,.08);border:1px solid rgba(52,199,89,.35);border-radius:12px;padding:10px 14px;margin:0 0 12px;min-width:0}
.screen-label{display:block;font-size:11.5px;font-weight:700;color:var(--ok);margin-bottom:4px;text-transform:uppercase;letter-spacing:.08em}
.screen pre{margin:0;font-family:var(--mono);font-size:13px;line-height:1.55;white-space:pre-wrap;color:var(--text)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 6px}
.search{min-height:44px;border:1px solid var(--border);border-radius:999px;padding:0 18px;font-size:14.5px;background:#fff;color:var(--text);flex:1 1 200px;min-width:0}
.search:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.fchip{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--border);background:#fff;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.fchip[aria-pressed="true"]{background:rgba(0,113,227,.1);border-color:var(--accent);color:var(--accent-dark)}
.progline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:10px 0 6px}
.progline b{color:var(--text)}
.sum-bar{height:8px;background:#e8e8ed;border-radius:999px;overflow:hidden;margin:0 0 16px}
.sum-bar i{display:block;height:100%;background:linear-gradient(90deg,#37a0ff,var(--accent));border-radius:999px;transition:width .3s ease}

.task-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin:0 0 12px;min-width:0;overflow:hidden}
.task-head-btn{display:flex;width:100%;background:none;border:none;cursor:pointer;gap:10px;align-items:center;padding:16px 18px;text-align:left;min-height:56px}
.task-head-btn:hover{background:rgba(0,0,0,.03)}
.task-num{font-family:var(--mono);font-size:13px;font-weight:700;color:var(--accent);background:rgba(0,113,227,.1);border-radius:8px;padding:4px 9px;flex:none}
.task-title{font-size:15.5px;font-weight:600;flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.task-tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{font-size:12px;color:#48484a;background:#e8e8ed;border-radius:999px;padding:4px 10px;white-space:nowrap}
.tag.easy{background:rgba(52,199,89,.16);color:#1c7c3c}
.tag.mid{background:rgba(255,159,10,.16);color:#8a5a00}
.tag.hard{background:rgba(255,69,58,.14);color:#b3261e}
.tag.solved{background:rgba(52,199,89,.16);color:#1c7c3c;font-weight:700}
.chev{color:var(--muted);font-size:14px;flex:none}
.task-body{padding:0 18px 18px;border-top:1px solid var(--border)}
.task-text{margin:12px 0;font-size:14.5px;line-height:1.6}
.label-sm{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:0 0 6px}
textarea.code-input{width:100%;min-height:150px;resize:vertical;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-family:var(--mono);font-size:13px;line-height:1.6;background:#fff;color:var(--text)}
textarea.code-input:focus{outline:3px solid rgba(0,113,227,.35);border-color:var(--accent)}
.task-actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.btn-small.on{background:rgba(52,199,89,.14);border-color:rgba(52,199,89,.5);color:#1c7c3c}
.btn-small.warnbtn{color:#8a5a00;border-color:rgba(255,159,10,.5)}
.hint{display:flex;gap:12px;background:rgba(255,159,10,.09);border:1px solid rgba(255,159,10,.35);border-radius:14px;padding:12px 14px;margin:10px 0 4px}
.hint>div{min-width:0;flex:1}
.hint-ic{font-size:20px;flex:none;line-height:1.4}
.hint p{margin:0;font-size:14px;line-height:1.6}
.etalon{margin:10px 0 4px}
.etalon .code-window{margin:0}
.confirm{background:rgba(194,42,30,.07);border:1px solid rgba(194,42,30,.35);border-radius:14px;padding:12px 14px;margin:10px 0 4px;font-size:14px}
.confirm p{margin:0 0 10px}
.empty-list{color:var(--muted);font-size:14.5px;padding:18px;border:1px dashed var(--border);border-radius:var(--radius);text-align:center}

.sum-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;margin-top:16px;display:grid;gap:18px}
.sum-row{display:flex;gap:14px;align-items:flex-start}
.sum-ic{flex:none;width:44px;height:44px;border-radius:12px;background:rgba(0,113,227,.1);display:grid;place-items:center;font-size:20px}
.sum-body{flex:1;min-width:0}
.sum-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:14.5px;margin-bottom:6px}
.sum-top b{font-size:15px}
.sum-note{color:var(--muted);font-size:13px;margin:6px 0 0}
.sum-actions{display:flex;justify-content:center;margin:22px 0 6px}

.report{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;max-width:820px;margin:16px auto 0;min-width:0}
.report h2{margin:0 0 4px;font-size:24px}
.report .meta{display:grid;gap:4px;font-size:14.5px;margin:12px 0 6px}
.report h3{font-size:16px;margin:18px 0 6px}
.report pre{background:#f5f5f7;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:var(--mono);font-size:12.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
.report .rep-note{color:var(--muted);font-size:13px;margin:6px 0}
.report-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:18px 0 4px}
.hint-print{color:var(--muted);font-size:13.5px;text-align:center;margin:0 0 40px}

.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);background:#1d1d1f;color:#fff;padding:12px 20px;border-radius:999px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;z-index:100;box-shadow:var(--shadow-lift);max-width:calc(100vw - 40px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  body{background:#fff}
  .no-print{display:none !important}
  .container{padding:0;max-width:100%}
  .report{border:none;box-shadow:none;margin:0;padding:0;max-width:100%}
  .report pre{white-space:pre-wrap;word-break:break-word}
}
@media (max-width:640px){
  .card{padding:16px}
  .task-head-btn{padding:14px}
  .task-body{padding:0 14px 14px}
  pre.code{font-size:12px;padding:12px}
  .sum-card{padding:16px}
  .task-tags{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
</style>
</head>
<body>
<a class="skip no-print" href="#main">Перейти к содержимому</a>
<div id="app"></div>
<script>
/* аварийный экран: если основной скрипт упадёт, покажем текст ошибки вместо пустоты */
window.addEventListener("error", function(ev){
  var a = document.getElementById("app");
  if(a && !a.innerHTML.trim()){
    a.innerHTML = '<div class="fatal">Ошибка скрипта: ' + (ev.message || "неизвестная") + '</div>';
  }
});
</script>
<script>
"use strict";
/* ================= CONSTANTS ================= */
var META = { num:2, topic:"Принятие решений", author:"Масликов М.М." };
var DONE_SHARE = 0.6; /* порог «Пройдено»: доля решённых задач главы */

/* Краткая справка по главе 2 */
var REF_CARDS = [
  { t:"Выражение if",
    p:"Ветвление в Python начинается со слова if: тело выполняется, только если условие истинно (True). Операторы тела пишутся с отступом; блок заканчивается, когда отступ выравнивается.",
    code:'num = float(input("Введите число:"))\nif num == 0:\n    result = "Введен ноль"\nif num != 0:\n    result = "Введен не ноль"\nprint(result)' },
  { t:"if-else: взаимоисключающие условия",
    p:"Когда из двух вариантов всегда выполняется ровно один, используют if-else: при True работает тело if, иначе — тело else. Это короче и надёжнее двух отдельных if.",
    code:'if num == 0:\n    result = "Введен ноль"\nelse:\n    result = "Введен не ноль"\nprint(result)' },
  { t:"if-elif-else: выбор из нескольких альтернатив",
    p:"Цепочка elif проверяет условия по очереди; выполнится только одно тело. Блок else необязателен: без него при всех ложных условиях не выполнится ничего.",
    code:'if num > 0:\n    result = "Введено положительное число"\nelif num < 0:\n    result = "Введено отрицательное число"\nelse:\n    result = "Введен ноль"\nprint(result)' },
  { t:"Вложенные if",
    p:"Внутри тела if могут находиться любые выражения, включая другие if. Вложенная цепочка уточняет решение внешнего условия — так строятся многоуровневые проверки.",
    code:'if num > 0:\n    adjective = ""\n    if num >= 1000000:\n        adjective = " очень большое"\n    elif num >= 1000:\n        adjective = " большое"\n    result = "Это" + adjective + " положительное число"' },
  { t:"Булева логика и сравнение",
    p:"Условия строятся операторами сравнения (==, !=, <, <=, >, >=) и комбинируются операторами and (истинно, когда истинны оба), or (хотя бы одно) и not (обращение). Регистр ввода удобно приводить методом upper().",
    code:'x = int(input("Введите целое число:"))\nif x == 2 or x == 3 or x == 5 or x == 7 or x == 11:\n    print("Это одно из первых пяти простых чисел.")\nelse:\n    print("Это не одно из первых пяти простых чисел.")' }
];

/* Задачи главы 2: условие, подсказка, эталон, сложность по строкам решения книги */
var TASKS = [
  { id:35, title:"Чет или нечет?", diff:"easy",
    text:"Запросите целое число и выведите сообщение о том, является оно четным или нечетным.",
    example:"Введите целое число: 4\n4 четное.",
    hint:"Признак нечетности — остаток от деления на 2: num % 2 == 1.",
    solution:'# Чет или нечет\nnum = int(input("Введите целое число: "))\nif num % 2 == 1:\n    print(num, "нечетное.")\nelse:\n    print(num, "четное.")' },
  { id:36, title:"Собачий возраст", diff:"mid",
    text:"Переведите человеческий возраст в собачий: каждый из первых двух лет — 10.5 собачьих года, каждый последующий — 4. При отрицательном вводе выведите сообщение об ошибке.",
    hint:"Две ветки: до 2 лет включительно умножаем на 10.5, дальше 21 + 4 за каждый год сверх двух; отдельно проверка на отрицательность.",
    solution:'# Собачий возраст\nhuman = int(input("Введите возраст в человеческих годах: "))\nif human < 0:\n    print("Ошибка: возраст не может быть отрицательным.")\nelif human <= 2:\n    dog = human * 10.5\nelse:\n    dog = 2 * 10.5 + (human - 2) * 4\n    print("В собачьих годах это: %.1f" % dog)' },
  { id:37, title:"Гласные и согласные", diff:"mid",
    text:"Запросите букву латинского алфавита. Для a, e, i, o, u выведите «гласная», для y — «иногда гласная, иногда согласная», иначе — «согласная».",
    hint:"Цепочка if-elif-else: пять гласных через or, затем особый случай y.",
    solution:'# Гласная или согласная\nletter = input("Введите букву латинского алфавита: ")\nif letter == "a" or letter == "e" or letter == "i" or letter == "o" or letter == "u":\n    print("Это гласная буква.")\nelif letter == "y":\n    print("Иногда гласная, иногда согласная.")\nelse:\n    print("Это согласная буква.")' },
  { id:38, title:"Угадайте фигуру", diff:"hard",
    text:"Определите вид фигуры по количеству сторон: корректны значения от 3 до 10 (треугольник … десятиугольник). За пределами диапазона выведите уведомление.",
    hint:"Цепочка elif для 3–10; при неверном вводе имя фигуры остаётся пустым — по нему и печатаем ошибку.",
    solution:'# Вид фигуры по количеству сторон\nnsides = int(input("Введите количество сторон фигуры: "))\nname = ""\nif nsides == 3:\n    name = "треугольник"\nelif nsides == 4:\n    name = "прямоугольник"\nelif nsides == 5:\n    name = "пятиугольник"\nelif nsides == 6:\n    name = "шестиугольник"\nelif nsides == 7:\n    name = "семиугольник"\nelif nsides == 8:\n    name = "восьмиугольник"\nelif nsides == 9:\n    name = "девятиугольник"\nelif nsides == 10:\n    name = "десятиугольник"\nif name == "":\n    print("Введенное количество сторон не поддерживается программой.")\nelse:\n    print("Эта фигура:", name)' },
  { id:39, title:"Сколько дней в месяце?", diff:"mid",
    text:"Запросите название месяца и отобразите количество дней в нем. Для февраля укажите «28 или 29» с учетом високосного года.",
    hint:"Начните с 31 дня и корректируйте: 30 у апреля, июня, сентября, ноября; февраль — строковый ответ.",
    solution:'# Количество дней в месяце\nmonth = input("Введите название месяца: ")\ndays = 31\nif month == "Апрель" or month == "Июнь" or month == "Сентябрь" or month == "Ноябрь":\n    days = 30\nelif month == "Февраль":\n    days = "28 или 29"\nprint("Количество дней в месяце", month, "равно", days)' },
  { id:40, title:"Громкость звука", diff:"mid",
    text:"Введите уровень шума в децибелах. Если он равен одному из значений таблицы (130 — отбойный молоток, 106 — газонокосилка, 70 — будильник, 40 — тихая комната), назовите источник; если между ними — укажите соседей; вне диапазона — выведите сообщение.",
    hint:"Идите сверху вниз: сначала «громче 130», затем точные совпадения и ветки «между».",
    solution:'# Уровень громкости\nnoise = int(input("Введите уровень шума (дБ): "))\nif noise > 130:\n    print("Громче, чем отбойный молоток.")\nelif noise == 130:\n    print("Отбойный молоток.")\nelif noise > 106:\n    print("Между газонокосилкой и отбойным молотком.")\nelif noise == 106:\n    print("Газовая газонокосилка.")\nelif noise > 70:\n    print("Между будильником и газонокосилкой.")\nelif noise == 70:\n    print("Будильник.")\nelif noise > 40:\n    print("Между тихой комнатой и будильником.")\nelif noise == 40:\n    print("Тихая комната.")\nelse:\n    print("Тише, чем в тихой комнате.")' },
  { id:41, title:"Классификация треугольников", diff:"mid",

    solution:'# Классификация треугольников\nside1 = float(input("Введите длину первой стороны: "))\nside2 = float(input("Введите длину второй стороны: "))\nside3 = float(input("Введите длину третьей стороны: "))\nif side1 == side2 and side2 == side3:\n    tri_type = "равносторонний"\nelif side1 == side2 or side2 == side3 or side3 == side1:\n    tri_type = "равнобедренный"\nelse:\n    tri_type = "разносторонний"\nprint("Это", tri_type, "треугольник")' },
  { id:42, title:"Узнать частоту по ноте", diff:"hard",
    text:"Запросите ноту в виде буквы и номера октавы (например C4) и покажите ее частоту. Частоты четвертой октавы: C 261.63, D 293.66, E 329.63, F 349.23, G 392.00, A 440.00, B 493.88; частота октавы n вдвое меньше частоты октавы n+1.",
    hint:"Разделите ввод: note = name[0], octave = int(name[1]); частоту таблицы делите на 2 ** (4 - octave).",
    solution:'# Частота ноты\nname = input("Введите название ноты, например C4: ")\nnote = name[0]\noctave = int(name[1])\nif note == "C":\n    freq = 261.63\nelif note == "D":\n    freq = 293.66\nelif note == "E":\n    freq = 329.63\nelif note == "F":\n    freq = 349.23\nelif note == "G":\n    freq = 392.00\nelif note == "A":\n    freq = 440.00\nelse:\n    freq = 493.88\nfreq = freq / 2 ** (4 - octave)\nprint("Частота ноты", name, "равна", freq)' },
  { id:43, title:"Узнать ноту по частоте", diff:"hard",
    text:"Запросите частоту в Гц. Если значение укладывается в диапазон ±1 Гц от одной из частот таблицы (C4…B4), выведите название ноты, иначе сообщите, что такой ноты не существует.",
    hint:"Для каждой частоты таблицы проверяйте окно через двойное неравенство; пустая строка-маркер означает «не найдено».",
    solution:'# Нота по частоте\nfreq = float(input("Введите частоту ноты (Гц): "))\nlimit = 1\nif 261.63 - limit <= freq <= 261.63 + limit:\n    note = "C4"\nelif 293.66 - limit <= freq <= 293.66 + limit:\n    note = "D4"\nelif 329.63 - limit <= freq <= 329.63 + limit:\n    note = "E4"\nelif 349.23 - limit <= freq <= 349.23 + limit:\n    note = "F4"\nelif 392.00 - limit <= freq <= 392.00 + limit:\n    note = "G4"\nelif 440.00 - limit <= freq <= 440.00 + limit:\n    note = "A4"\nelif 493.88 - limit <= freq <= 493.88 + limit:\n    note = "B4"\nelse:\n    note = ""\nif note == "":\n    print("Ноты с заданной частотой не существует.")\nelse:\n    print("Введенная частота примерно соответствует ноте", note)' },
  { id:44, title:"Портреты на банкнотах", diff:"hard",
    text:"Запросите номинал банкноты США (1, 2, 5, 10, 20, 50, 100) и отобразите имя деятеля на ней: Вашингтон, Джефферсон, Линкольн, Гамильтон, Джексон, Грант, Франклин. Для другого номинала — сообщение об ошибке.",
    hint:"Цепочка elif по номиналам; в else выводим ошибку.",
    solution:'# Портрет на банкноте\nbill = int(input("Введите номинал банкноты: "))\nif bill == 1:\n    who = "Джордж Вашингтон"\nelif bill == 2:\n    who = "Томас Джефферсон"\nelif bill == 5:\n    who = "Авраам Линкольн"\nelif bill == 10:\n    who = "Александр Гамильтон"\nelif bill == 20:\n    who = "Эндрю Джексон"\nelif bill == 50:\n    who = "Улисс Грант"\nelif bill == 100:\n    who = "Бенджамин Франклин"\nelse:\n    who = ""\nif who == "":\n    print("Банкноты введенного номинала не существует.")\nelse:\n    print("Портрет на банкноте:", who)' },
  { id:45, title:"Даты праздников", diff:"mid",
    text:"Запросите день и месяц. Если дата совпадает с одним из праздников (1 января — Новый год, 1 июля — День Канады, 25 декабря — Рождество), выведите название, иначе сообщите, что праздников нет.",
    hint:"Каждый праздник — пара условий «месяц и день», соединённых через and.",
    solution:'# Даты праздников\nday = int(input("Введите день: "))\nmonth = input("Введите месяц: ")\nif month == "Январь" and day == 1:\n    holiday = "Новый год"\nelif month == "Июль" and day == 1:\n    holiday = "День Канады"\nelif month == "Декабрь" and day == 25:\n    holiday = "Рождество"\nelse:\n    holiday = ""\nif holiday == "":\n    print("На заданную дату праздники не приходятся.")\nelse:\n    print("Праздник на эту дату:", holiday)' },
  { id:46, title:"Какого цвета клетка?", diff:"mid",

    hint:"Переведите букву в номер столбца: ord(letter) - ord('a') + 1. Сумма с номером строки четная — клетка черная, нечетная — белая.",
    solution:'# Цвет шахматной клетки\ncell = input("Введите координаты клетки: ")\nletter = cell[0]\ndigit = int(cell[1])\ncol = ord(letter) - ord("a") + 1\nif (col + digit) % 2 == 0:\n    color = "черная"\nelse:\n    color = "белая"\nprint("Клетка", cell, color)' },
  { id:47, title:"Определение времени года", diff:"hard",
    text:"Запросите месяц (название) и день; выведите сезон. Границы: весна с 20 марта, лето с 21 июня, осень с 22 сентября, зима с 21 декабря.",
    hint:"Пограничные месяцы (март, июнь, сентябрь, декабрь) требуют вложенного if по дню внутри elif; остальные месяцы определяются без проверки дня.",
    solution:'# Сезон по дате\nmonth = input("Введите название месяца: ")\nday = int(input("Введите день: "))\nif month == "Январь" or month == "Февраль":\n    season = "Зима"\nelif month == "Март":\n    if day < 20:\n        season = "Зима"\n    else:\n        season = "Весна"\nelif month == "Апрель" or month == "Май":\n    season = "Весна"\nelif month == "Июнь":\n    if day < 21:\n        season = "Весна"\n    else:\n        season = "Лето"\nelif month == "Июль" or month == "Август":\n    season = "Лето"\nelif month == "Сентябрь":\n    if day < 22:\n        season = "Лето"\n    else:\n        season = "Осень"\nelif month == "Октябрь" or month == "Ноябрь":\n    season = "Осень"\nelif month == "Декабрь":\n    if day < 21:\n        season = "Осень"\n    else:\n        season = "Зима"\nprint(month, day, "соответствует сезону", season)' },
  { id:48, title:"Знаки зодиака", diff:"hard",
    text:"Запросите дату рождения (месяц числом и день) и выведите знак зодиака: Козерог (22.12–19.01), Водолей (20.01–18.02), Рыбы (19.02–20.03), Овен (21.03–19.04), Телец (20.04–20.05), Близнецы (21.05–20.06), Рак (21.06–22.07), Лев (23.07–22.08), Дева (23.08–22.09), Весы (23.09–22.10), Скорпион (23.10–21.11), Стрелец (22.11–21.12).",
    hint:"Каждый знак — пара условий «конец одного месяца ИЛИ начало следующего», соединённых or; выстройте цепочку elif, последний знак оставьте в else.",
    solution:'# Знак зодиака\nmonth = int(input("Введите месяц рождения (1-12): "))\nday = int(input("Введите день рождения: "))\nif (month == 1 and day <= 19) or (month == 12 and day >= 22):\n    sign = "Козерог"\nelif (month == 1 and day >= 20) or (month == 2 and day <= 18):\n    sign = "Водолей"\nelif (month == 2 and day >= 19) or (month == 3 and day <= 20):\n    sign = "Рыбы"\nelif (month == 3 and day >= 21) or (month == 4 and day <= 19):\n    sign = "Овен"\nelif (month == 4 and day >= 20) or (month == 5 and day <= 20):\n    sign = "Телец"\nelif (month == 5 and day >= 21) or (month == 6 and day <= 20):\n    sign = "Близнецы"\nelif (month == 6 and day >= 21) or (month == 7 and day <= 22):\n    sign = "Рак"\nelif (month == 7 and day >= 23) or (month == 8 and day <= 22):\n    sign = "Лев"\nelif (month == 8 and day >= 23) or (month == 9 and day <= 22):\n    sign = "Дева"\nelif (month == 9 and day >= 23) or (month == 10 and day <= 22):\n    sign = "Весы"\nelif (month == 10 and day >= 23) or (month == 11 and day <= 21):\n    sign = "Скорпион"\nelse:\n    sign = "Стрелец"\nprint("Ваш знак зодиака:", sign)' },
  { id:49, title:"Китайский гороскоп", diff:"hard",
    text:"Запросите год рождения и выведите животное китайского гороскопа: цикл из 12 лет, 2000 — Дракон, 2001 — Змея, 2002 — Лошадь, 2003 — Коза, 2004 — Обезьяна, 2005 — Петух, 2006 — Собака, 2007 — Свинья, 2008 — Крыса, 2009 — Бык, 2010 — Тигр, 2011 — Кролик.",
    hint:"Животное зависит от остатка year % 12: для 2000 года остаток 8 — это Дракон; разложите все 12 остатков по цепочке elif.",
    solution:'# Китайский гороскоп\nyear = int(input("Введите год: "))\nif year % 12 == 8:\n    animal = "Дракон"\nelif year % 12 == 9:\n    animal = "Змея"\nelif year % 12 == 10:\n    animal = "Лошадь"\nelif year % 12 == 11:\n    animal = "Коза"\nelif year % 12 == 0:\n    animal = "Обезьяна"\nelif year % 12 == 1:\n    animal = "Петух"\nelif year % 12 == 2:\n    animal = "Собака"\nelif year % 12 == 3:\n    animal = "Свинья"\nelif year % 12 == 4:\n    animal = "Крыса"\nelif year % 12 == 5:\n    animal = "Бык"\nelif year % 12 == 6:\n    animal = "Тигр"\nelse:\n    animal = "Кролик"\nprint("Год %d ассоциирован с животным: %s." % (year, animal))' },
  { id:50, title:"Шкала Рихтера", diff:"mid",
    text:"Запросите магнитуду землетрясения и выведите описание: меньше 2.0 — минимальное; до 3.0 — очень слабое; до 4.0 — слабое; до 5.0 — промежуточное; до 6.0 — умеренное; до 7.0 — сильное; до 8.0 — очень сильное; до 10.0 — огромное; 10.0 и выше — разрушительное.",

    solution:'# Описание землетрясения по шкале Рихтера\nm = float(input("Введите магнитуду: "))\nif m < 2.0:\n    desc = "Минимальное"\nelif m < 3.0:\n    desc = "Очень слабое"\nelif m < 4.0:\n    desc = "Слабое"\nelif m < 5.0:\n    desc = "Промежуточное"\nelif m < 6.0:\n    desc = "Умеренное"\nelif m < 7.0:\n    desc = "Сильное"\nelif m < 8.0:\n    desc = "Очень сильное"\nelif m < 10.0:\n    desc = "Огромное"\nelse:\n    desc = "Разрушительное"\nprint("Описание землетрясения:", desc)' },
  { id:51, title:"Корни квадратичной функции", diff:"mid",
    text:"Запросите коэффициенты a, b, c (a ≠ 0) и выведите количество действительных корней уравнения ax²+bx+c=0 и их значения.",
    hint:"Дискриминант d = b² − 4ac: отрицательный — корней нет, ноль — один корень −b/(2a), положительный — два корня через sqrt(d).",
    solution:'# Корни квадратного уравнения\nfrom math import sqrt\na = float(input("Введите a: "))\nb = float(input("Введите b: "))\nc = float(input("Введите c: "))\nd = b ** 2 - 4 * a * c\nif d < 0:\n    print("Действительных корней нет.")\nelif d == 0:\n    print("Один действительный корень:", -b / (2 * a))\nelse:\n    print("Два действительных корня:")\n    print("x1 =", (-b + sqrt(d)) / (2 * a))\n    print("x2 =", (-b - sqrt(d)) / (2 * a))' },
  { id:52, title:"Буквенные оценки – в числовые", diff:"hard",
    text:"Запросите буквенную оценку (A+, A, A-, B+, B, B-, C+, C, C-, D+, D, F) и выведите числовой эквивалент (4.0, 4.0, 3.7, 3.3, 3.0, 2.7, 2.3, 2.0, 1.7, 1.3, 1.0, 0). При неверном вводе — сообщение об ошибке.",
    example:"Введите буквенную оценку: B+\nБуквенная оценка B+ соответствует 3.3 баллам.",
    hint:"Приведите ввод к верхнему регистру методом upper(); используйте значение −1 как маркер ошибочного ввода.",
    solution:'# Буквенная оценка в числовую\nletter = input("Введите буквенную оценку: ")\nletter = letter.upper()\nif letter == "A+" or letter == "A":\n    gp = 4.0\nelif letter == "A-":\n    gp = 3.7\nelif letter == "B+":\n    gp = 3.3\nelif letter == "B":\n    gp = 3.0\nelif letter == "B-":\n    gp = 2.7\nelif letter == "C+":\n    gp = 2.3\nelif letter == "C":\n    gp = 2.0\nelif letter == "C-":\n    gp = 1.7\nelif letter == "D+":\n    gp = 1.3\nelif letter == "D":\n    gp = 1.0\nelif letter == "F":\n    gp = 0\nelse:\n    gp = -1\nif gp == -1:\n    print("Введена некорректная оценка.")\nelse:\n    print("Буквенная оценка", letter, "соответствует", gp, "баллам.")' },
  { id:53, title:"Числовые оценки – в буквенные", diff:"hard",
    text:"Обратная задача: по числовой оценке от 0 до 4.0 выведите ближайшую буквенную (округление до ближайшей буквы). Значению 4.0 и выше соответствует A+.",
    hint:"Граница между соседними буквами — середина между их числовыми значениями (например, между A- 3.7 и B+ 3.3 это 3.5); стройте цепочку сверху вниз.",
    solution:'# Числовая оценка в буквенную\ng = float(input("Введите числовую оценку: "))\nif g < 0 or g > 4.0:\n    print("Введено некорректное значение.")\nelif g >= 4.0:\n    print("A+")\nelif g >= 3.85:\n    print("A")\nelif g >= 3.5:\n    print("A-")\nelif g >= 3.15:\n    print("B+")\nelif g >= 2.85:\n    print("B")\nelif g >= 2.5:\n    print("B-")\nelif g >= 2.15:\n    print("C+")\nelif g >= 1.85:\n    print("C")\nelif g >= 1.5:\n    print("C-")\nelif g >= 1.15:\n    print("D+")\nelif g >= 0.5:\n    print("D")\nelse:\n    print("F")' },
  { id:54, title:"Оценка работы", diff:"mid",
    text:"Запросите рейтинг сотрудника (допустимы 0.0, 0.4 и 0.6 и выше) и выведите уровень (низкий, удовлетворительный, высокий) и прибавку к зарплате: рейтинг × $2400. Некорректный рейтинг — сообщение об ошибке.",

    solution:'# Оценка работы сотрудника\nrating = float(input("Введите рейтинг: "))\nif rating == 0.0:\n    performance = "низкий"\nelif rating == 0.4:\n    performance = "удовлетворительный"\nelif rating >= 0.6:\n    performance = "высокий"\nelse:\n    performance = ""\nif performance == "":\n    print("Введен ошибочный рейтинг.")\nelse:\n    print("Основываясь на введенном рейтинге, ваш уровень: %s." % performance)\n    print("Прибавка к зарплате составит: $%.2f." % (rating * 2400.00))' },
  { id:55, title:"Длины волн видимой части спектра", diff:"hard",
    text:"Запросите длину волны в нанометрах и выведите цвет: 380–449 фиолетовый, 450–494 синий, 495–569 зеленый, 570–589 желтый, 590–619 оранжевый, 620–750 красный. Значение за пределами видимого спектра — сообщение об этом.",

  { id:56, title:"Определение частоты", diff:"hard",
    text:"Запросите частоту электромагнитной волны в Гц и выведите категорию: менее 3×10⁹ — радиоволны; до 3×10¹² — микроволны; до 4.3×10¹⁴ — инфракрасное излучение; до 7.5×10¹⁴ — видимое; до 3×10¹⁷ — ультрафиолет; до 3×10¹⁹ — рентгеновское; выше — гамма-излучение.",

  { id:57, title:"Счет за телефон", diff:"hard",
    text:"Тариф включает 50 минут и 50 сообщений за $15.00; каждая лишняя минута — $0.25, лишнее сообщение — $0.15. К счету добавляются $0.44 за поддержку 911, а вся сумма облагается налогом 5 %. Запросите минуты и сообщения и выведите базовую сумму, доплаты (только если они есть), 911, налог и итог — с двумя знаками после запятой.",
    hint:"Доплаты считайте отдельно: (minutes − 50) × 0.25 и (sms − 50) × 0.15 при положительных превышениях; налог начисляется на сумму вместе с 0.44.",
    solution:'# Счет за телефон\nminutes = int(input("Минут за месяц: "))\nsms = int(input("Сообщений за месяц: "))\nbase = 15.00\nextra_min = 0.00\nextra_sms = 0.00\nif minutes > 50:\n    extra_min = (minutes - 50) * 0.25\nif sms > 50:\n    extra_sms = (sms - 50) * 0.15\nsupport = 0.44\nsubtotal = base + extra_min + extra_sms + support\ntax = subtotal * 0.05\ntotal = subtotal + tax\nprint("Базовая сумма: %.2f" % base)\nif extra_min > 0:\n    print("Дополнительные минуты: %.2f" % extra_min)\nif extra_sms > 0:\n    print("Дополнительные сообщения: %.2f" % extra_sms)\nprint("Поддержка 911: %.2f" % support)\nprint("Налог: %.2f" % tax)\nprint("Итог к оплате: %.2f" % total)' },
  { id:58, title:"Високосный год?", diff:"mid",

    solution:'# Високосный год?\nyear = int(input("Введите год: "))\nif year % 400 == 0:\n    isLeap = True\nelif year % 100 == 0:\n    isLeap = False\nelif year % 4 == 0:\n    isLeap = True\nelse:\n    isLeap = False\nif isLeap:\n    print(year, "– високосный год.")\nelse:\n    print(year, "– невисокосный год.")' },

    hint:"Сначала определите количество дней в текущем месяце (февраль — через правило високосного года), затем переход через конец месяца и через 31 декабря.",
    solution:'# Следующий день\nyear = int(input("Введите год: "))\nmonth = int(input("Введите месяц (1-12): "))\nday = int(input("Введите день: "))\nif month == 12 and day == 31:\n    year = year + 1\n    month = 1\n    day = 1\nelse:\n    if month == 2:\n        if year % 400 == 0 or (year % 4 == 0 and year % 100 != 0):\n            days = 29\n        else:\n            days = 28\n    elif month == 4 or month == 6 or month == 9 or month == 11:\n        days = 30\n    else:\n        days = 31\n    if day == days:\n        month = month + 1\n        day = 1\n    else:\n        day = day + 1\nprint("Следующая дата: %d-%02d-%02d" % (year, month, day))' },
  { id:60, title:"На какой день недели выпадает 1 января?", diff:"hard",
    text:"Запросите год и выведите название дня недели, на который приходится 1 января, по формуле: (year + (year−1)//4 − (year−1)//100 + (year−1)//400) % 7, где 0 — воскресенье, 6 — суббота.",
    hint:"// даёт деление с округлением вниз; остаток 0–6 переведите в название дня цепочкой if-elif или списком-таблицей.",
    solution:'# День недели для 1 января\nyear = int(input("Введите год: "))\nd = (year + (year - 1) // 4 - (year - 1) // 100 + (year - 1) // 400) % 7\nif d == 0:\n    name = "воскресенье"\nelif d == 1:\n    name = "понедельник"\nelif d == 2:\n    name = "вторник"\nelif d == 3:\n    name = "среда"\nelif d == 4:\n    name = "четверг"\nelif d == 5:\n    name = "пятница"\nelse:\n    name = "суббота"\nprint("1 января", year, "года — это", name)' },
  { id:61, title:"Действительный номерной знак машины?", diff:"mid",
    text:"Старый формат знака: три заглавные буквы и три цифры; новый: четыре цифры и три заглавные буквы. Запросите знак и сообщите, какому формату он соответствует; если ни одному — укажите это.",
    example:"Введите номерной знак машины: ABC123\nЭто номерной знак старого образца.",
    hint:"Сначала проверьте длину (6 или 7), затем каждый символ сравнениями >= 'A' и <= 'Z' для букв и >= '0' и <= '9' для цифр.",
    solution:'# Формат номерного знака\nplate = input("Введите номерной знак машины: ")\nif len(plate) == 6 and plate[0] >= "A" and plate[0] <= "Z" and plate[1] >= "A" and plate[1] <= "Z" and plate[2] >= "A" and plate[2] <= "Z" and plate[3] >= "0" and plate[3] <= "9" and plate[4] >= "0" and plate[4] <= "9" and plate[5] >= "0" and plate[5] <= "9":\n    print("Это номерной знак старого образца.")\nelif len(plate) == 7 and plate[0] >= "0" and plate[0] <= "9" and plate[1] >= "0" and plate[1] <= "9" and plate[2] >= "0" and plate[2] <= "9" and plate[3] >= "0" and plate[3] <= "9" and plate[4] >= "A" and plate[4] <= "Z" and plate[5] >= "A" and plate[5] <= "Z" and plate[6] >= "A" and plate[6] <= "Z":\n    print("Это номерной знак нового образца.")\nelse:\n    print("Неверный номерной знак.")' },
  { id:62, title:"Играем в рулетку", diff:"hard",
    text:"Сымитируйте запуск рулетки (числа 0–36 и 00) генератором случайных чисел и выведите выпавший номер и сыгравшие ставки: число, цвет (красное/черное; 0 и 00 без цвета), чет/нечет (только 1–36), половину (1–18 или 19–36). Красные числа: 1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36.",
    hint:"Номер 00 закодируйте числом 37 (randrange(0, 38)); красные числа удобно держать списком и проверять через in; для нуля в ветке цвета используйте pass.",
    solution:'# Рулетка: выпавший номер и ставки\nfrom random import randrange\nred = [1, 3, 5, 7, 9, 12, 14, 16, 18, 19, 21, 23, 25, 27, 30, 32, 34, 36]\nvalue = randrange(0, 38)\nif value == 37:\n    print("Выпавший номер: 00...")\n    print("Выигравшая ставка: 00")\nelse:\n    print("Выпавший номер: %d..." % value)\n    print("Выигравшая ставка:", value)\n    if value in red:\n        print("Выигравшая ставка: красное")\n    elif value != 0:\n        print("Выигравшая ставка: черное")\n    if 1 <= value <= 36:\n        if value % 2 == 1:\n            print("Выигравшая ставка: нечетное")\n        else:\n            print("Выигравшая ставка: четное")\n        if value <= 18:\n            print("Выигравшая ставка: от 1 до 18")\n        else:\n            print("Выигравшая ставка: от 19 до 36")' }
];
var DIFF_LABEL = { easy:"легкая", mid:"средняя", hard:"сложная" };

var LS_STATE = "python-task2-state-v1";
var LS_PROGRESS = "python-trainer-progress-v1";

/* ================= STATE ================= */
var state = {
  screen:"start",
  tab:"ref",               // ref | tasks | report
  student:{last:"", first:"", cls:""},
  startErrors:null,
  codes:{},
  hintShown:{}, hintUsed:{},
  etalonShown:{}, etalonViewed:{}, etalonNoAttempt:{}, etalonConfirm:{},
  solved:{},
  open:{},
  filter:"all",            // all | todo | done
  query:"",
  reportOpen:false
};
function loadSaved(){
  try{
    var raw = localStorage.getItem(LS_STATE);
    if(!raw) return;
    var s = JSON.parse(raw);
    if(s.student) state.student = s.student;
    if(s.codes) state.codes = Object.assign(state.codes, s.codes);
    if(s.hintUsed) state.hintUsed = Object.assign(state.hintUsed, s.hintUsed);
    if(s.etalonViewed) state.etalonViewed = Object.assign(state.etalonViewed, s.etalonViewed);
    if(s.etalonNoAttempt) state.etalonNoAttempt = Object.assign(state.etalonNoAttempt, s.etalonNoAttempt);
    if(s.solved) state.solved = Object.assign(state.solved, s.solved);
    if(s.reportOpen) state.reportOpen = true;
  }catch(e){}
}
function persist(){
  try{
    localStorage.setItem(LS_STATE, JSON.stringify({
      student:state.student, codes:state.codes,
      hintUsed:state.hintUsed, etalonViewed:state.etalonViewed,
      etalonNoAttempt:state.etalonNoAttempt, solved:state.solved,
      reportOpen:state.reportOpen
    }));
  }catch(e){}
}
function setProgress(status){
  try{
    var raw = localStorage.getItem(LS_PROGRESS);
    var p = raw ? JSON.parse(raw) : {topic:{}, task:{}};
    p.task = p.task || {};
    p.task[String(META.num)] = status;
    localStorage.setItem(LS_PROGRESS, JSON.stringify(p));
  }catch(e){}
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(ch){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
  });
}
function inline(s){
  return esc(s)
    .replace(/\*\*([^*]+?)\*\*/g, "<b>$1</b>")
    .replace(/`([^`]+?)`/g, '<code style="font-family:var(--mono);font-size:.9em;background:rgba(0,113,227,.09);color:var(--accent-dark);border-radius:6px;padding:1px 6px;">$1</code>');
}
function hlPy(src){
  return esc(src).replace(
    /(#.*$)|(&quot;(?:[^&\\]|\\.)*?&quot;|&#39;(?:[^&\\]|\\.)*?&#39;)|\b(from|import|def|return|if|elif|else|for|while|in|and|or|not|True|False|pass|break|continue|try|except|with|as|lambda|global|None)\b|\b(\d+(?:\.\d+)?)\b|([A-Za-z_][A-Za-z0-9_]*)(?=\s*\()/gm,
    function(m, com, str, kw, num, fn){
      if(com) return '<span class="tk-c">' + com + '</span>';
      if(str) return '<span class="tk-s">' + str + '</span>';
      if(kw)  return '<span class="tk-k">' + kw + '</span>';
      if(num) return '<span class="tk-n">' + num + '</span>';
      if(fn)  return '<span class="tk-f">' + fn + '</span>';
      return m;
    });
}
function codeWindow(src, file){
  return '<div class="code-window"><div class="code-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="file">' + (file || "program.py") + '</span></div><pre class="code">' + hlPy(src) + '</pre></div>';
}
/* счётчики */
function solvedCount(){ return TASKS.filter(function(t){ return state.solved[t.id]; }).length; }
function codeCount(){ return TASKS.filter(function(t){ return (state.codes[t.id] || "").trim(); }).length; }
function hintCount(){ return TASKS.filter(function(t){ return state.hintUsed[t.id]; }).length; }
function etalonCount(){ return TASKS.filter(function(t){ return state.etalonViewed[t.id]; }).length; }
function touched(t){
  return (state.codes[t.id] || "").trim() || state.hintUsed[t.id] || state.etalonViewed[t.id] || state.solved[t.id];
}
function doneThreshold(){ return Math.ceil(TASKS.length * DONE_SHARE); }

/* ================= RENDER ================= */
var app = document.getElementById("app");

function renderStart(){
  var e = state.startErrors || {};
  var st = state.student;
  return '<div class="container"><div class="start-card">' +
    '<span class="eyebrow">Python · Практика, глава ' + META.num + '</span>' +
    '<h1>' + META.topic + '</h1>' +
    '<p class="author">Автор курса: ' + META.author + '</p>' +
    '<ul class="start-list"><li>Краткая справка: 5 карточек с конструкциями ветвления.</li><li>' + TASKS.length + ' задачи главы ' + META.num + ' сборника Б. Стивенсона: подсказка и эталон у каждой.</li><li>Прогресс, фильтры и поиск по задачам.</li><li>В конце — сводка «Итоги» и отчёт для сохранения в PDF.</li></ul>' +
    '<form id="startForm" novalidate>' +
      '<div class="field"><label for="fLast">Фамилия</label><input id="fLast" name="last" autocomplete="family-name" value="' + esc(st.last) + '" class="' + (e.last ? "bad" : "") + '" placeholder="Иванов">' + (e.last ? '<p class="err">' + e.last + '</p>' : '') + '</div>' +
      '<div class="field"><label for="fFirst">Имя</label><input id="fFirst" name="first" autocomplete="given-name" value="' + esc(st.first) + '" class="' + (e.first ? "bad" : "") + '" placeholder="Иван">' + (e.first ? '<p class="err">' + e.first + '</p>' : '') + '</div>' +
      '<div class="field"><label for="fCls">Класс</label><input id="fCls" name="cls" value="' + esc(st.cls) + '" class="' + (e.cls ? "bad" : "") + '" placeholder="9А">' + (e.cls ? '<p class="err">' + e.cls + '</p>' : '') + '</div>' +
      '<button class="btn btn-primary" type="submit">Начать практику</button>' +
    '</form></div></div>';
}
function renderRef(){
  var cards = REF_CARDS.map(function(c){
    return '<div class="card"><h3>' + esc(c.t) + '</h3><p>' + inline(c.p) + '</p>' + codeWindow(c.code, "spravka.py") + '</div>';
  }).join("");
  return '<div class="container"><p class="section-note">Только то, что нужно для задач главы. Полная теория — в блоках 1–6 курса; здесь — рабочие карточки-шпаргалки по ветвлениям.</p>' + cards +
    '<div class="call info"><span class="call-ic" aria-hidden="true">💡</span><div><p>Во всех задачах пишите комментарии и понятные имена переменных. Код автосохраняется в этом браузере.</p></div></div></div>';
}
function taskCard(t){
  var open = !!state.open[t.id];
  var solved = !!state.solved[t.id];
  var tags = '<span class="tag ' + t.diff + '">' + DIFF_LABEL[t.diff] + '</span>' +
    (solved ? '<span class="tag solved">решено</span>' : '');
  var body = "";
  if(open){
    body = '<div class="task-body">' +
      '<p class="task-text">' + esc(t.text) + '</p>' +
      (t.example ? '<div class="screen"><span class="screen-label">Пример ввода и вывода</span><pre>' + esc(t.example) + '</pre></div>' : '') +
      '<p class="label-sm" id="codeLbl' + t.id + '">Мой код</p>' +
      '<textarea class="code-input" data-code="' + t.id + '" rows="7" spellcheck="false" aria-labelledby="codeLbl' + t.id + '" placeholder="Введите здесь свой код на Python">' + esc(state.codes[t.id] || "") + '</textarea>' +
      '<div class="task-actions">' +
        '<button class="btn-small' + (state.hintShown[t.id] ? " on" : "") + '" type="button" data-act="toggle-hint" data-id="' + t.id + '">💡 Подсказка</button>' +
        '<button class="btn-small' + (state.etalonShown[t.id] ? " on" : "") + '" type="button" data-act="etalon" data-id="' + t.id + '">Эталон решения</button>' +
        '<button class="btn-small' + (solved ? " on" : "") + '" type="button" data-act="toggle-solved" data-id="' + t.id + '">' + (solved ? "✓ Решено" : "Отметить решённой") + '</button>' +
      '</div>' +
      (state.hintShown[t.id] ? '<div class="hint"><span class="hint-ic" aria-hidden="true">💡</span><div><p><b>Подсказка.</b> ' + esc(t.hint) + '</p></div></div>' : '') +
      (state.etalonConfirm[t.id] ? '<div class="confirm"><p>В поле «Мой код» пока пусто. Показать эталон без своей попытки? Это попадёт в отчёт.</p><div class="task-actions" style="margin:0"><button class="btn-small warnbtn" type="button" data-act="etalon-yes" data-id="' + t.id + '">Да, показать</button><button class="btn-small" type="button" data-act="etalon-no" data-id="' + t.id + '">Отмена</button></div></div>' : '') +
      (state.etalonShown[t.id] && state.etalonViewed[t.id] ? '<div class="etalon"><p class="label-sm">Эталон решения</p>' + codeWindow(t.solution, "task" + t.id + ".py") + '</div>' : '') +
    '</div>';
  }
  return '<div class="task-card">' +
    '<button class="task-head-btn" type="button" data-act="toggle-open" data-id="' + t.id + '" aria-expanded="' + open + '">' +
      '<span class="task-num">' + t.id + '</span>' +
      '<span class="task-title">' + esc(t.title) + '</span>' +
      '<span class="task-tags">' + tags + '</span>' +
      '<span class="chev" aria-hidden="true">' + (open ? "▴" : "▾") + '</span>' +
    '</button>' + body + '</div>';
}
function renderTasks(){
  var q = state.query.trim().toLowerCase();
  var list = TASKS.filter(function(t){
    if(state.filter === "todo" && state.solved[t.id]) return false;
    if(state.filter === "done" && !state.solved[t.id]) return false;
    if(q && String(t.id) !== q && t.title.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  var solved = solvedCount();
  var pct = Math.round(solved / TASKS.length * 100);
  var first = TASKS[0].id, lastN = TASKS[TASKS.length - 1].id;
  var toolbar =
    '<div class="progline"><span>Решено: <b>' + solved + ' из ' + TASKS.length + '</b></span><span><b>' + pct + '%</b> главы</span></div>' +
    '<div class="sum-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
    '<div class="toolbar">' +
      '<input class="search" id="taskSearch" type="search" value="' + esc(state.query) + '" placeholder="Поиск: номер или название задачи" aria-label="Поиск задач">' +
      '<button class="fchip" type="button" data-filter="all" aria-pressed="' + (state.filter === "all") + '">Все</button>' +
      '<button class="fchip" type="button" data-filter="todo" aria-pressed="' + (state.filter === "todo") + '">Нерешённые</button>' +
      '<button class="fchip" type="button" data-filter="done" aria-pressed="' + (state.filter === "done") + '">Решённые</button>' +
    '</div>';
  var cards = list.length
    ? list.map(taskCard).join("")
    : '<div class="empty-list">По вашему запросу ничего не нашлось. Сбросьте поиск или выберите фильтр «Все».</div>';
  return '<div class="container"><p class="section-note">Задачи ' + first + '–' + lastN + ' из главы ' + META.num + ' сборника Б. Стивенсона. Раскройте задачу, напишите код, при необходимости возьмите подсказку. Эталон откроется после своей попытки кода — либо с отметкой в отчёте.</p>' + toolbar + cards + '</div>';
}
function sumRow(icon, label, value, pct, note){
  return '<div class="sum-row"><span class="sum-ic" aria-hidden="true">' + icon + '</span><div class="sum-body">' +
    '<div class="sum-top"><b>' + label + '</b><span>' + value + '</span></div>' +
    '<div class="sum-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
    (note ? '<p class="sum-note">' + note + '</p>' : '') +
    '</div></div>';
}
function renderSummary(){
  var solved = solvedCount(), code = codeCount(), hints = hintCount(), etal = etalonCount();
  var th = doneThreshold();
  var warns = [];
  if(code === 0) warns.push("Пока нет кода ни к одной задаче.");
  if(solved < th) warns.push("До зачёта главы не хватает решённых задач: нужно " + th + " из " + TASKS.length + " (сейчас " + solved + ").");
  return '<div class="container">' +
    '<p class="section-note">Сводка работы за главу. Глава считается пройденной, когда отмечено решёнными не менее ' + Math.round(DONE_SHARE * 100) + '% задач (' + th + ' из ' + TASKS.length + ') и нажата кнопка завершения.</p>' +
    '<div class="sum-card">' +
      sumRow("💻", "Код написан", code + " из " + TASKS.length + " задач", Math.round(code / TASKS.length * 100), "Поле «Мой код» непустое.") +
      sumRow("✅", "Отмечено решёнными", solved + " из " + TASKS.length, Math.round(solved / TASKS.length * 100), "Порог зачёта главы: " + th + " задач.") +
      sumRow("💡", "Подсказки", "использовано " + hints, Math.round(hints / TASKS.length * 100), "Подсказка фиксируется в отчёте.") +
      sumRow("📖", "Эталоны", "просмотрено " + etal, Math.round(etal / TASKS.length * 100), "Просмотр без своей попытки помечается отдельно.") +
    '</div>' +
    (warns.length
      ? '<div class="call warn" style="margin-top:16px"><span class="call-ic" aria-hidden="true">⚠️</span><div><p><b>Обратите внимание:</b></p><ul style="margin:6px 0 0;padding-left:20px;display:grid;gap:4px;font-size:14px;">' + warns.map(function(w){ return "<li>" + w + "</li>"; }).join("") + '</ul></div></div>'
      : '<div class="call ok" style="margin-top:16px"><span class="call-ic" aria-hidden="true">🎉</span><div><p>Порог главы достигнут — можно завершать урок и сохранять отчёт!</p></div></div>') +
    '<div class="sum-actions"><button class="btn btn-primary" type="button" data-act="finish">Завершить урок и открыть отчёт</button></div>' +
    '<p class="hint-print" style="margin:10px 0 40px">В отчёт попадут только задачи, с которыми вы работали: ваш код и отметки о подсказках и эталонах.</p>' +
  '</div>';
}
function renderReport(){
  var st = state.student;
  var date = new Date().toLocaleDateString("ru-RU");
  var solved = solvedCount();
  var passed = solved >= doneThreshold();
  var touchedList = TASKS.filter(touched);
  var tasks = touchedList.length
    ? touchedList.map(function(t){
        return '<h3>Задача ' + t.id + '. ' + esc(t.title) + '</h3>' +
          '<p class="rep-note">Решена: <b>' + (state.solved[t.id] ? "да" : "нет") + '</b> · Подсказка: <b>' + (state.hintUsed[t.id] ? "да" : "нет") + '</b> · Эталон: <b>' + (state.etalonViewed[t.id] ? (state.etalonNoAttempt[t.id] ? "да, без своей попытки" : "да") : "нет") + '</b></p>' +
          '<p class="label-sm">Мой код</p><pre>' + ((state.codes[t.id] || "").trim() ? esc(state.codes[t.id]) : "— код не предоставлен —") + '</pre>';
      }).join("")
    : '<p class="rep-note">Работ с задачами не зафиксировано.</p>';
  return '<div class="container"><div class="report" id="reportSheet">' +
    '<h2>Отчёт по практике</h2>' +
    '<div class="meta">' +
      '<span><b>Глава:</b> ' + META.num + '. ' + META.topic + ' (сборник Б. Стивенсона)</span>' +
      '<span><b>Автор курса:</b> ' + META.author + '</span>' +
      '<span><b>Ученик:</b> ' + esc(st.last) + ' ' + esc(st.first) + '</span>' +
      '<span><b>Класс:</b> ' + esc(st.cls) + '</span>' +
      '<span><b>Дата:</b> ' + date + '</span>' +
      '<span><b>Решено задач:</b> ' + solved + ' из ' + TASKS.length + ' · глава зачтена: ' + (passed ? "да" : "нет") + '</span>' +
      '<span><b>Подсказок:</b> ' + hintCount() + ' · <b>эталонов:</b> ' + etalonCount() + ' · задач с кодом: ' + codeCount() + '</span>' +
    '</div>' +
    '<h3>Выполненные работы</h3>' + tasks +
    '</div>' +
    '<div class="report-actions no-print"><button class="btn btn-primary" type="button" data-act="print">Сохранить отчёт в PDF</button></div>' +
    '<p class="hint-print no-print">Откроется окно печати — выберите «Сохранить как PDF». В отчёт входят только задачи, с которыми была работа.</p>' +
    '</div>';
}
function renderLesson(){
  var st = state.student;
  var tabs = [
    ["ref", "Справка"],
    ["tasks", "Задачи"],
    ["report", state.reportOpen ? "Отчёт" : "Итоги"]
  ];
  var body = state.tab === "ref" ? renderRef()
    : state.tab === "tasks" ? renderTasks()
    : (state.reportOpen ? renderReport() : renderSummary());
  return '<div class="container no-print"><div class="lesson-head">' +
    '<h1>Глава ' + META.num + '. ' + META.topic + '</h1>' +
    '<button class="chip-student" type="button" data-act="edit-student" title="Изменить данные ученика">' + esc(st.last) + ' ' + esc(st.first) + ' · ' + esc(st.cls) + ' ✎</button>' +
    '</div>' +
    '<div class="tabs" role="tablist" aria-label="Разделы практики">' +
    tabs.map(function(t){
      return '<button class="tab" role="tab" type="button" aria-selected="' + (state.tab === t[0]) + '" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join("") +
    '</div></div>' + body;
}
function render(){
  app.innerHTML = state.screen === "start" ? renderStart() : renderLesson();
}

/* ================= HANDLERS ================= */
var toastEl = null, toastTimer = null;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 2600);
}
function onStartSubmit(e){
  e.preventDefault();
  var f = e.target;
  var last = f.last.value.trim(), first = f.first.value.trim(), cls = f.cls.value.trim();
  var errs = {};
  if(last.length < 2) errs.last = "Введите фамилию (минимум 2 символа).";
  if(first.length < 2) errs.first = "Введите имя (минимум 2 символа).";
  if(!cls) errs.cls = "Введите класс, например 9А.";
  state.student = {last:last, first:first, cls:cls};
  if(Object.keys(errs).length){
    state.startErrors = errs;
    render();
    var bad = app.querySelector("input.bad");
    if(bad) bad.focus();
    return;
  }
  state.startErrors = null;
  state.screen = "lesson";
  state.tab = "ref";
  setProgress("progress");
  persist();
  render();
  showToast("Практика начата: " + TASKS.length + " задачи впереди!");
}
function onAppClick(e){
  var tabBtn = e.target.closest("[data-tab]");
  if(tabBtn){
    state.tab = tabBtn.dataset.tab;
    render();
    window.scrollTo(0, 0);
    return;
  }
  var fBtn = e.target.closest("[data-filter]");
  if(fBtn){
    state.filter = fBtn.dataset.filter;
    render();
    return;
  }
  var btn = e.target.closest("[data-act]");
  if(!btn) return;
  var act = btn.dataset.act;
  var id = Number(btn.dataset.id || 0);
  if(act === "toggle-open"){
    state.open[id] = !state.open[id];
    render();
  }
  else if(act === "toggle-hint"){
    var nowH = !state.hintShown[id];
    state.hintShown[id] = nowH;
    if(nowH) state.hintUsed[id] = true;
    persist();
    render();
  }
  else if(act === "toggle-solved"){
    state.solved[id] = !state.solved[id];
    persist();
    render();
    showToast(state.solved[id] ? "Задача " + id + " отмечена решённой." : "Отметка снята с задачи " + id + ".");
  }
  else if(act === "etalon"){
    if(state.etalonViewed[id]){
      state.etalonShown[id] = !state.etalonShown[id];
    }else if((state.codes[id] || "").trim()){
      state.etalonViewed[id] = true;
      state.etalonShown[id] = true;
      persist();
    }else{
      state.etalonConfirm[id] = true;
    }
    render();
  }
  else if(act === "etalon-yes"){
    state.etalonViewed[id] = true;
    state.etalonNoAttempt[id] = true;
    state.etalonShown[id] = true;
    state.etalonConfirm[id] = false;
    persist();
    render();
  }
  else if(act === "etalon-no"){
    state.etalonConfirm[id] = false;
    render();
  }
  else if(act === "finish"){
    state.reportOpen = true;
    state.tab = "report";
    setProgress(solvedCount() >= doneThreshold() ? "done" : "progress");
    persist();
    render();
    window.scrollTo(0, 0);
    showToast("Урок завершён! Отчёт готов к сохранению в PDF.");
  }
  else if(act === "edit-student"){ state.screen = "start"; render(); window.scrollTo(0, 0); }
  else if(act === "print"){ window.print(); }
}
function onAppInput(e){
  var ta = e.target.closest("textarea[data-code]");
  if(ta){
    state.codes[Number(ta.dataset.code)] = ta.value;
    persist();
    return;
  }
  if(e.target.id === "taskSearch"){
    state.query = e.target.value;
    render();
    var el = document.getElementById("taskSearch");
    if(el){
      el.focus();
      el.setSelectionRange(el.value.length, el.value.length);
    }
  }
}

/* ================= INIT ================= */
function init(){
  loadSaved();
  toastEl = document.createElement("div");
  toastEl.className = "toast";
  toastEl.setAttribute("role", "status");
  toastEl.setAttribute("aria-live", "polite");
  document.body.appendChild(toastEl);
  render();
  app.addEventListener("click", onAppClick);
  app.addEventListener("input", onAppInput);
  app.addEventListener("submit", onStartSubmit);
}
try{
  init();
}catch(err){
  app.innerHTML = '<div class="fatal">Ошибка при запуске: ' + err.message + '</div>';
}
</script>
</body>
</html>
